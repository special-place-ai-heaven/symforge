          def workspace_file(value: str, *, artifact: bool = False) -> Path:
              relative = relative_path(value)
              if artifact and not value.startswith("target/ci/lifecycle-v11/"):
                  fail("an artifact path is outside the lifecycle evidence directory")
              current = workspace
              for part in relative.parts:
                  current = current / part
                  if current.is_symlink():
                      fail("an evidence path contains a symbolic link")
              if not current.is_file():
                  fail("a required evidence file is unavailable")
              resolved = current.resolve(strict=True)
              if not resolved.is_relative_to(workspace):
                  fail("an evidence path escapes the repository")
              return current

          def read_artifact(value: str) -> bytes:
              return workspace_file(value, artifact=True).read_bytes()

          git_environment = {
              key: value
              for key, value in os.environ.items()
              if not key.startswith("GIT_")
          }
          git_environment.update(
              {
                  "GIT_NO_REPLACE_OBJECTS": "1",
                  "GIT_OPTIONAL_LOCKS": "0",
                  "LC_ALL": "C",
              }
          )

          def run_git(
              arguments: list[str],
              *,
              allowed_codes: tuple[int, ...] = (0,),
          ) -> subprocess.CompletedProcess[bytes]:
              completed = subprocess.run(
                  [trusted_git, *arguments],
                  cwd=workspace,
                  env=git_environment,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  shell=False,
                  check=False,
              )
              if completed.returncode not in allowed_codes:
                  fail("a trusted Git identity check failed")
              return completed

          def git_text(arguments: list[str]) -> str:
              value = run_git(arguments).stdout
              try:
                  text = value.decode("ascii")
              except UnicodeDecodeError as error:
                  raise SystemExit("trusted Git returned a non-ASCII identity") from error
              if not text.endswith("\n"):
                  fail("trusted Git returned a malformed identity")
              text = text.rstrip("\r\n")
              if "\n" in text or "\r" in text:
                  fail("trusted Git returned multiple identities")
              return text

          def git_blob(commit: str, value: str) -> bytes:
              relative_path(value)
              return run_git(["cat-file", "blob", f"{commit}:{value}"]).stdout

          def pinned_blob(commit: str, value: str) -> bytes:
              blob = git_blob(commit, value)
              if workspace_file(value).read_bytes() != blob:
                  fail("a pinned release-tree file differs from the worktree")
              return blob

          def extract_sentinel(
              blob: bytes,
              start: str,
              end: str,
              context: str,
          ) -> dict[str, object]:
              try:
                  text = blob.decode("utf-8")
              except UnicodeDecodeError as error:
                  raise SystemExit(f"{context} is not UTF-8") from error
              if text.count(start) != 1 or text.count(end) != 1:
                  fail(f"{context} sentinel markers are not exact")
              inner = text.split(start, 1)[1].split(end, 1)[0]
              match = re.fullmatch(
                  r"\s*\x60{3}json\r?\n(.*?)\r?\n\x60{3}\s*",
                  inner,
                  re.DOTALL,
              )
              if match is None:
                  fail(f"{context} sentinel payload is malformed")
              parsed = parse_json_bytes(match.group(1).encode("utf-8"), context)
              if not isinstance(parsed, dict):
                  fail(f"{context} sentinel payload is not an object")
              return parsed

          def source_file(target: object) -> str:
              if not isinstance(target, str) or "::" not in target:
                  fail("a frozen source target is malformed")
              value = target.split("::", 1)[0]
              relative_path(value)
              if not value.endswith(".rs"):
                  fail("a frozen source target is not Rust source")
              return value

          def atomic_create(value: str, payload: bytes) -> None:
              path = workspace / relative_path(value)
              temporary = path.with_name(path.name + ".tmp")
              if path.exists() or path.is_symlink() or temporary.exists() or temporary.is_symlink():
                  fail("a closed T089 output already exists")
              with temporary.open("xb") as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temporary, path)
              directory = os.open(path.parent, os.O_RDONLY)
              try:
                  os.fsync(directory)
              finally:
                  os.close(directory)

          if (
              not bundle.is_dir()
              or bundle.is_symlink()
              or bundle.resolve(strict=True) != bundle
              or any(path.is_symlink() for path in bundle.rglob("*"))
              or not re.fullmatch(r"[0-9a-f]{64}", expected_approval_sha256)
          ):
              fail("the lifecycle evidence boundary is unsafe")
          for output in (TASK_PATH, EVIDENCE_PATH):
              path = workspace / output
              if path.exists() or path.is_symlink():
                  fail("causally premature closed T089 evidence exists")
          initial_files = {
              path.relative_to(bundle).as_posix()
              for path in bundle.rglob("*")
              if path.is_file()
          }

          release_commit = git_text(["rev-parse", "--verify", "HEAD^{commit}"])
          release_tree = git_text(["rev-parse", "--verify", "HEAD^{tree}"])
          if release_commit != expected_release:
              fail("the finalizer is not running at the gated release commit")
          requirements = parse_json_bytes(
              pinned_blob(release_commit, REQUIREMENTS_PATH),
              "lifecycle release requirements",
          )
          requirements_fields = {
              "kind",
              "phase",
              "required_oracle_receipts",
              "required_review_documents",
              "required_task_receipts",
              "schema_version",
          }
          if (
              not isinstance(requirements, dict)
              or set(requirements) != requirements_fields
              or requirements.get("kind")
              != "symforge.lifecycle_release_evidence_requirements.v11"
              or not isinstance(requirements.get("schema_version"), int)
              or isinstance(requirements.get("schema_version"), bool)
              or requirements.get("schema_version") != 1
              or requirements.get("phase") != "active"
          ):
              fail("the lifecycle release requirements are not an active closed schema")

          def closed_paths(name: str, pattern: str) -> list[str]:
              values = requirements.get(name)
              if (
                  not isinstance(values, list)
                  or not values
                  or any(not isinstance(value, str) for value in values)
                  or values != sorted(values)
                  or len(values) != len(set(values))
                  or any(re.fullmatch(pattern, value) is None for value in values)
              ):
                  fail(f"the active {name} set is not closed")
              return values

          required_oracle_receipts = closed_paths(
              "required_oracle_receipts",
              r"target/ci/lifecycle-v11/[a-z0-9][a-z0-9._-]*\.json",
          )
          required_review_documents = closed_paths(
              "required_review_documents",
              r"docs/reviews/[A-Za-z0-9][A-Za-z0-9._-]*\.md",
          )
          if required_review_documents != [RELEASE_GATE_REVIEW_PATH]:
              fail("the active review set does not close the release-gate review")
          required_task_receipts = closed_paths(
              "required_task_receipts",
              r"target/ci/lifecycle-v11/task-T[0-9]{3}\.json",
          )
          expected_task_receipts = [
              f"target/ci/lifecycle-v11/task-T{task_number:03d}.json"
              for task_number in range(78, 89)
          ]
          if required_task_receipts != expected_task_receipts:
              fail("the active task receipt set does not close T078 through T088")
          expected_initial_files = {
              value.removeprefix("target/ci/lifecycle-v11/")
              for value in (*required_task_receipts, *required_oracle_receipts)
          }
          expected_initial_files.add(
              APPROVAL_PATH.removeprefix("target/ci/lifecycle-v11/")
          )
          if initial_files != expected_initial_files:
              fail("the T089 input bundle differs from the active closed requirements")
          approved_commit = git_text(["rev-parse", "--verify", f"{expected_approved}^{{commit}}"])
          approved_tree = git_text(["rev-parse", "--verify", f"{expected_approved}^{{tree}}"])
          if approved_commit != expected_approved or approved_tree != expected_approved_tree:
              fail("the approved refreeze identity changed")
          ancestry = run_git(
              ["merge-base", "--is-ancestor", approved_commit, release_commit],
              allowed_codes=(0, 1),
          )
          if ancestry.returncode != 0 or approved_commit == release_commit:
              fail("the approved refreeze is not a strict ancestor")

          checker_blob = pinned_blob(release_commit, CHECKER_PATH)
          workflow_blob = pinned_blob(release_commit, WORKFLOW_PATH)
          verifier_blob = pinned_blob(release_commit, VERIFIER_PATH)
          if (
              git_blob(approved_commit, CHECKER_PATH) != checker_blob
              or git_blob(approved_commit, WORKFLOW_PATH) != workflow_blob
              or git_blob(approved_commit, VERIFIER_PATH) != verifier_blob
          ):
              fail("a frozen gate executable changed after approval")

          approval_bytes = read_artifact(APPROVAL_PATH)
          if sha256_bytes(approval_bytes) != expected_approval_sha256:
              fail("the closed approval result changed")
          approval = parse_json_bytes(approval_bytes, "approval result")
          approval_fields = {
              "allowed_signers_sha256",
              "approved_commit",
              "approved_tree",
              "approval_history_count",
              "approval_history_inventory",
              "approval_history_inventory_sha256",
              "approval_history_root_sha256",
              "approval_predecessor_digest",
              "approval_sequence",
              "command_argv_sha256",
              "command_id",
              "exit_code",
              "expected_repository",
              "external_inputs",
              "kind",
              "record_sha256",
              "release_commit",
              "release_identity_sha256",
              "release_tree",
              "runner_kind",
              "runner_repository",
              "schema_version",
              "signature_sha256",
              "status",
              "stderr_sha256",
              "stdout_sha256",
              "verifier_sha256",
              "workflow_commit",
              "workflow_event",
              "workflow_job",
              "workflow_path",
              "workflow_run_attempt",
              "workflow_run_id",
              "workflow_sha256",
          }
          if (
              not isinstance(approval, dict)
              or set(approval) != approval_fields
              or approval.get("kind") != "symforge.refreeze_approval_verification_result.v11"
              or approval.get("schema_version") != 1
              or approval.get("status") != "passed"
              or approval.get("approved_commit") != approved_commit
              or approval.get("approved_tree") != approved_tree
              or approval.get("release_commit") != release_commit
              or approval.get("release_tree") != release_tree
              or approval.get("verifier_sha256") != sha256_bytes(verifier_blob)
              or approval.get("workflow_sha256") != sha256_bytes(workflow_blob)
              or approval.get("stdout_sha256") != EXPECTED_STDOUT_SHA256
              or approval.get("stderr_sha256") != EXPECTED_STDERR_SHA256
          ):
              fail("the closed approval result does not match the frozen gate")

          trace_blob = pinned_blob(release_commit, TRACE_PATH)
          acceptance_blob = pinned_blob(release_commit, ACCEPTANCE_PATH)
          retirement_blob = pinned_blob(release_commit, RETIREMENT_PATH)
          trace = extract_sentinel(
              trace_blob,
              "<!-- SYMFORGE LIFECYCLE ORACLE TRACEABILITY V11 JSON START -->",
              "<!-- SYMFORGE LIFECYCLE ORACLE TRACEABILITY V11 JSON END -->",
              "traceability contract",
          )
          acceptance = extract_sentinel(
              acceptance_blob,
              "<!-- SYMFORGE LIFECYCLE ACCEPTANCE ORACLES V11 JSON START -->",
              "<!-- SYMFORGE LIFECYCLE ACCEPTANCE ORACLES V11 JSON END -->",
              "acceptance contract",
          )
          extract_sentinel(
              retirement_blob,
              "<!-- SYMFORGE V10 AUTHORITY RETIREMENT V11 JSON START -->",
              "<!-- SYMFORGE V10 AUTHORITY RETIREMENT V11 JSON END -->",
              "retirement contract",
          )
          catalogs = trace.get("catalogs")
          commands = catalogs.get("commands") if isinstance(catalogs, dict) else None
          tests = catalogs.get("tests") if isinstance(catalogs, dict) else None
          seams = catalogs.get("seams") if isinstance(catalogs, dict) else None
          oracles_value = acceptance.get("oracles")
          if (
              not all(isinstance(value, dict) for value in (commands, tests, seams))
              or not isinstance(oracles_value, list)
          ):
              fail("the frozen lifecycle catalogs are malformed")

          oracles: list[dict[str, object]] = []
          oracle_ids: set[str] = set()
          artifact_paths: set[str] = set()
          requirement_map = {
              **{f"FR-{number:03d}": [] for number in range(1, 53)},
              **{f"SC-{number:03d}": [] for number in range(1, 27)},
          }
          for oracle in oracles_value:
              if not isinstance(oracle, dict):
                  fail("a frozen acceptance oracle is malformed")
              oracle_id = oracle.get("oracle_id")
              artifact = oracle.get("ci_artifact")
              requirement_ids = oracle.get("requirement_ids")
              if (
                  not isinstance(oracle_id, str)
                  or oracle_id in oracle_ids
                  or not isinstance(artifact, str)
                  or artifact in artifact_paths
                  or not isinstance(requirement_ids, list)
                  or any(requirement not in requirement_map for requirement in requirement_ids)
              ):
                  fail("a frozen acceptance oracle identity is malformed")
              relative_path(artifact)
              oracle_ids.add(oracle_id)
              artifact_paths.add(artifact)
              oracles.append(oracle)
              for requirement in requirement_ids:
                  requirement_map[requirement].append(oracle_id)
          oracles.sort(key=lambda oracle: str(oracle["oracle_id"]))
          for mapped in requirement_map.values():
              mapped.sort()
              if not mapped:
                  fail("a frozen requirement has no acceptance oracle")
          if sorted(artifact_paths) != required_oracle_receipts:
              fail("the active oracle receipt set differs from the frozen acceptance contract")

          requirement_receipts = [
              {
                  "oracle_ids": requirement_map[requirement],
                  "release_tree": release_tree,
                  "requirement_id": requirement,
                  "status": "passed",
              }
              for requirement in requirement_map
          ]
          oracle_receipts = [
              {
                  "artifact": str(oracle["ci_artifact"]),
                  "artifact_sha256": sha256_bytes(
                      read_artifact(str(oracle["ci_artifact"]))
                  ),
                  "oracle_id": str(oracle["oracle_id"]),
                  "release_tree": release_tree,
                  "status": "passed",
              }
              for oracle in oracles
          ]

          exact_cases: list[dict[str, object]] = []
          benchmarks: list[dict[str, object]] = []
          for test_id, test in tests.items():
              if not isinstance(test_id, str) or not isinstance(test, dict):
                  fail("a frozen lifecycle test is malformed")
              kind = test.get("kind")
              if kind not in ("planned_exact", "inherited_exact", "planned_benchmark"):
                  continue
              target = test.get("target")
              command_id = test.get("command_id")
              command = commands.get(command_id) if isinstance(command_id, str) else None
              if not isinstance(target, str) or not isinstance(command, str):
                  fail("a frozen lifecycle test command is malformed")
              source = source_file(target)
              source_hash = sha256_bytes(pinned_blob(release_commit, source))
              base = {
                  "command": command,
                  "release_tree": release_tree,
                  "source_sha256": source_hash,
                  "status": "passed",
                  "target": target,
                  "test_id": test_id,
              }
              if kind == "planned_benchmark":
                  registration = test.get("registration")
                  matches = [
                      oracle
                      for oracle in oracles
                      if oracle.get("trace_test_id") == test_id
                  ]
                  if not isinstance(registration, str) or len(matches) != 1:
                      fail("a frozen benchmark mapping is malformed")
                  artifact = str(matches[0]["ci_artifact"])
                  benchmarks.append(
                      {
                          **base,
                          "receipt": artifact,
                          "receipt_sha256": sha256_bytes(read_artifact(artifact)),
                          "registration": registration,
                      }
                  )
              else:
                  exact_cases.append(base)
          exact_cases.sort(key=lambda receipt: str(receipt["test_id"]))
          benchmarks.sort(key=lambda receipt: str(receipt["test_id"]))

          reverse_seams: dict[str, list[str]] = {}
          for seam_id, anchors in seams.items():
              if not isinstance(seam_id, str) or not isinstance(anchors, list):
                  fail("a frozen production seam is malformed")
              for anchor in anchors:
                  if not isinstance(anchor, str):
                      fail("a frozen production anchor is malformed")
                  reverse_seams.setdefault(anchor, []).append(seam_id)
          source_receipts = []
          for anchor in sorted(reverse_seams):
              source_receipts.append(
                  {
                      "anchor": anchor,
                      "release_tree": release_tree,
                      "seam_ids": sorted(reverse_seams[anchor]),
                      "source_sha256": sha256_bytes(
                          pinned_blob(release_commit, source_file(anchor))
                      ),
                      "status": "passed",
                  }
              )

          tasks_blob = pinned_blob(release_commit, TASKS_PATH)
          try:
              task_text = tasks_blob.decode("utf-8")
          except UnicodeDecodeError as error:
              raise SystemExit("the frozen task catalog is not UTF-8") from error
          declarations = re.findall(
              r"^- \[[ xX]\] T089\b[^\r\n]*$",
              task_text,
              re.MULTILINE,
          )
          if len(declarations) != 1:
              fail("the frozen T089 task declaration is not exact")
          review_results = [
              {
                  "path": review_path,
                  "sha256": sha256_bytes(pinned_blob(release_commit, review_path)),
                  "status": "passed",
              }
              for review_path in required_review_documents
          ]
          task_result = {
              "artifact_results": [
                  *review_results,
                  {
                      "path": APPROVAL_PATH,
                      "sha256": expected_approval_sha256,
                      "status": "passed",
                  },
              ],
              "command_results": [
                  {
                      "command_id": "refreeze-approval-and-evidence",
                      "exit_code": 0,
                      "stderr_sha256": str(approval["stderr_sha256"]),
                      "stdout_sha256": str(approval["stdout_sha256"]),
                  }
              ],
              "kind": "symforge.lifecycle_release_task_result.v11",
              "release_commit": release_commit,
              "release_tree": release_tree,
              "schema_version": 1,
              "status": "passed",
              "task_declaration_sha256": sha256_bytes(
                  declarations[0].encode("utf-8")
              ),
              "task_id": "T089",
          }
          task_payload = canonical_bytes(task_result) + b"\n"
          atomic_create(TASK_PATH, task_payload)

          task_receipts = []
          for artifact in (*required_task_receipts, TASK_PATH):
              match = re.fullmatch(
                  r"target/ci/lifecycle-v11/task-(T[0-9]{3})\.json",
                  artifact,
              )
              if match is None:
                  fail("a task receipt path is malformed")
              task_id = match.group(1)
              task_receipts.append(
                  {
                      "artifact": artifact,
                      "artifact_sha256": sha256_bytes(read_artifact(artifact)),
                      "release_tree": release_tree,
                      "status": "passed",
                      "task_id": task_id,
                  }
              )

          evidence = {
              "acceptance_contract_sha256": sha256_bytes(acceptance_blob),
              "approval_verification": {
                  "result_artifact": APPROVAL_PATH,
                  "result_sha256": expected_approval_sha256,
                  "status": "passed",
              },
              "approved_refreeze_commit": approved_commit,
              "approved_refreeze_tree": approved_tree,
              "benchmark_receipts": benchmarks,
              "checker_sha256": sha256_bytes(checker_blob),
              "kind": "symforge.lifecycle_release_evidence.v11",
              "oracle_receipts": oracle_receipts,
              "release_commit": release_commit,
              "release_tree": release_tree,
              "requirement_receipts": requirement_receipts,
              "retirement_contract_sha256": sha256_bytes(retirement_blob),
              "rust_case_receipts": exact_cases,
              "schema_version": 1,
              "source_receipts": source_receipts,
              "status": "passed",
              "task_receipts": task_receipts,
              "trace_contract_sha256": sha256_bytes(trace_blob),
          }
          evidence_payload = canonical_bytes(evidence) + b"\n"
          atomic_create(EVIDENCE_PATH, evidence_payload)

          if sha256_bytes(read_artifact(APPROVAL_PATH)) != expected_approval_sha256:
              fail("the closed approval result changed during T089")
          final_files = {
              path.relative_to(bundle).as_posix()
              for path in bundle.rglob("*")
              if path.is_file()
          }
          if final_files != initial_files | {"task-T089.json", "release-evidence.json"}:
              fail("the inline T089 finalizer wrote outside its exact allowlist")
          for arguments in (
              ["diff", "--quiet", "--no-ext-diff", "--no-textconv", "HEAD", "--"],
              [
                  "diff",
                  "--cached",
                  "--quiet",
                  "--no-ext-diff",
                  "--no-textconv",
                  "HEAD",
                  "--",
              ],
          ):
              if run_git(arguments, allowed_codes=(0, 1)).returncode != 0:
                  fail("the release worktree changed during T089")
          untracked = run_git(["ls-files", "--others", "-z"]).stdout
          for entry in untracked.split(b"\0"):
              if not entry:
                  continue
              try:
                  value = entry.decode("utf-8")
              except UnicodeDecodeError as error:
                  raise SystemExit("an untracked release path is not UTF-8") from error
              if not value.startswith("target/"):
                  fail("the release worktree has an unexpected untracked path")
          if (
              pinned_blob(release_commit, CHECKER_PATH) != checker_blob
              or pinned_blob(release_commit, WORKFLOW_PATH) != workflow_blob
              or git_blob(approved_commit, CHECKER_PATH) != checker_blob
              or git_blob(approved_commit, WORKFLOW_PATH) != workflow_blob
          ):
              fail("a frozen checker or workflow changed during T089")
          PY

      - name: Verify materialized Feature 020 V11 lifecycle evidence
        shell: bash
        env:
          APPROVAL_RESULT_SHA256: ${{ steps.gate.outputs.approval_result_sha256 }}
          BASH_ENV: ''
          ENV: ''
          GATED_RELEASE_REF: ${{ steps.gate.outputs.release_ref }}
          NODE_OPTIONS: ''
          NODE_PATH: ''
          PATH: ${{ steps.trusted-tools.outputs.safe_path }}
          SYMFORGE_LIFECYCLE_CARGO_EXECUTABLE: ${{ steps.trusted-tools.outputs.cargo }}
          SYMFORGE_LIFECYCLE_GIT_EXECUTABLE: ${{ steps.trusted-tools.outputs.git }}
          TRUSTED_GIT: ${{ steps.trusted-tools.outputs.git }}
          TRUSTED_NODE: ${{ steps.trusted-tools.outputs.node }}
          TRUSTED_PYTHON: ${{ steps.trusted-tools.outputs.python }}
        run: |
          set -euo pipefail
          "$TRUSTED_PYTHON" -I - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          trusted_git = os.environ["TRUSTED_GIT"]
          release_commit = os.environ["GATED_RELEASE_REF"]
          environment = {
              key: value
              for key, value in os.environ.items()
              if not key.startswith("GIT_")
          }
          environment.update(
              {
                  "GIT_NO_REPLACE_OBJECTS": "1",
                  "GIT_OPTIONAL_LOCKS": "0",
                  "LC_ALL": "C",
              }
          )

          def git_blob(path: str) -> bytes:
              result = subprocess.run(
                  [trusted_git, "cat-file", "blob", f"{release_commit}:{path}"],
                  cwd=workspace,
                  env=environment,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  shell=False,
                  check=False,
              )
              if result.returncode != 0:
                  raise SystemExit("cannot re-read a frozen release-tree file")
              return result.stdout

          for relative in (
              ".github/workflows/release.yml",
              "scripts/validate-lifecycle-oracle-traceability.cjs",
          ):
              path = workspace / relative
              if not path.is_file() or path.is_symlink() or path.read_bytes() != git_blob(relative):
                  raise SystemExit("a frozen workflow or checker changed before T090")
          approval = workspace / "target/ci/lifecycle-v11/refreeze-approval-result.json"
          if (
              not approval.is_file()
              or approval.is_symlink()
              or hashlib.sha256(approval.read_bytes()).hexdigest()
              != os.environ["APPROVAL_RESULT_SHA256"]
          ):
              raise SystemExit("the closed approval result changed before T090")
          PY
          node() { "$TRUSTED_NODE" "$@"; }
          node scripts/validate-lifecycle-oracle-traceability.cjs --require-materialized --evidence target/ci/lifecycle-v11/release-evidence.json

      - name: Upload closed Feature 020 V11 lifecycle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-020-v11-closed-release-evidence-${{ steps.gate.outputs.release_ref }}
          path: target/ci/lifecycle-v11/
          if-no-files-found: error
          retention-days: 90

  gate-release-ref:
    needs:
      - resolve-release-ref
      - verify-release-ref
      - feature-020-v11-gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.gate.outputs.release_ref }}
    steps:
      - id: gate
        name: Select the phase-appropriate release gate result
        shell: bash
        env:
          FEATURE_GATE_RESULT: ${{ needs.feature-020-v11-gate.result }}
          LIFECYCLE_GATE_ACTIVE: ${{ needs.resolve-release-ref.outputs.lifecycle_gate_active }}
          RELEASE_REF: ${{ needs.resolve-release-ref.outputs.release_ref }}
          VERIFY_RESULT: ${{ needs.verify-release-ref.result }}
        run: |
          set -euo pipefail
          if [[ "$VERIFY_RESULT" != "success" ]]; then
            echo "::error::Release verification did not succeed."
            exit 1
          fi
          case "$LIFECYCLE_GATE_ACTIVE" in
            true)
              if [[ "$FEATURE_GATE_RESULT" != "success" ]]; then
                echo "::error::The active Feature 020 lifecycle release gate did not succeed."
                exit 1
              fi
              ;;
            false)
              if [[ "$FEATURE_GATE_RESULT" != "skipped" ]]; then
                echo "::error::The pre-activation Feature 020 lifecycle gate unexpectedly ran."
                exit 1
              fi
              ;;
            *)
              echo "::error::The Feature 020 lifecycle gate phase is unavailable."
              exit 1
              ;;
          esac
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The phase-selected release commit is malformed."
            exit 1
          fi
          echo "release_ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"

  prepare-release:
    needs:
      - resolve-release-ref
      - gate-release-ref
    # feature-020-v11-gate is skipped in pre-activation, and a skip propagates
    # transitively through needs. gate-release-ref survives it via always() and
    # already hard-fails unless the phase-appropriate result held, so every job
    # below it must name a status function to stop inheriting that skip, and must
    # then restate the success it would otherwise have got implicitly.
    if: ${{ !cancelled() && needs.resolve-release-ref.result == 'success' && needs.gate-release-ref.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.context.outputs.release_created }}
      tag_name: ${{ steps.context.outputs.tag_name }}
      version: ${{ steps.context.outputs.version }}
      release_ref: ${{ steps.context.outputs.release_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate-release-ref.outputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run version sync tests
        env:
          SYMFORGE_REQUIRE_SSHSIG: '1'
        run: python -m unittest discover -s execution -p 'test_*.py'

      - name: Verify release metadata stays aligned
        run: python execution/version_sync.py check

      - id: release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-release: true
          include-component-in-tag: false
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # release-please skipping is silent and indistinguishable from "nothing to
      # release". It has now bitten this repo four times: two merge-strategy
      # variants recorded in CLAUDE.md, a `fix:` whose BODY the conventional
      # parser rejected (dropped the commit, cut no version, job still green),
      # and counting feat/fix since the previous tag after a release PR merged
      # (release-please aborted "untagged, merged release PRs outstanding";
      # this step then blocked Create GitHub release, so v10.2.0 never tagged).
      # A job may not report success for a release it did not observe, so prove
      # the absence — but an untagged merged release PR is the tagging path,
      # not a silent skip. See execution/prove_release_owed.py.
      - name: Prove that no release was owed
        if: ${{ steps.release.outputs.prs_created != 'true' && (github.event_name != 'workflow_dispatch' || inputs.tag == '') }}
        run: python -I execution/prove_release_owed.py

      - name: Auto-merge release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS_JSON: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          PR="$(python -I - <<'PY'
          import json
          import os

          try:
              pull_requests = json.loads(os.environ["RELEASE_PRS_JSON"])
          except (KeyError, json.JSONDecodeError, TypeError) as error:
              raise SystemExit("release-please did not return valid PR identity JSON") from error
          if not isinstance(pull_requests, list) or len(pull_requests) != 1:
              raise SystemExit("release-please did not return exactly one release PR")
          number = pull_requests[0].get("number") if isinstance(pull_requests[0], dict) else None
          if not isinstance(number, int) or isinstance(number, bool) or number < 1:
              raise SystemExit("release-please returned an invalid release PR number")
          print(number)
          PY
          )"
          if [[ ! "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The release-please PR identity is malformed."
            exit 1
          fi

          # Wait only for the exact action-returned PR's pending label.
          status=1
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            PR_CONTEXT="$(gh pr view "$PR" --json number,state,baseRefName,headRefName,labels)"
            if python -I - "$PR" "$PR_CONTEXT" <<'PY'
          import json
          import sys

          number = int(sys.argv[1])
          try:
              pull_request = json.loads(sys.argv[2])
          except (json.JSONDecodeError, TypeError) as error:
              raise SystemExit(2) from error
          if (
              not isinstance(pull_request, dict)
              or pull_request.get("number") != number
              or pull_request.get("state") != "OPEN"
              or pull_request.get("baseRefName") != "main"
              or not isinstance(pull_request.get("headRefName"), str)
              or not pull_request["headRefName"].startswith("release-please--branches--main")
          ):
              raise SystemExit(2)
          labels = pull_request.get("labels")
          if not isinstance(labels, list) or not all(isinstance(label, dict) for label in labels):
              raise SystemExit(2)
          raise SystemExit(
              0
              if sum(label.get("name") == "autorelease: pending" for label in labels) == 1
              else 1
          )
          PY
            then
              status=0
              break
            else
              status=$?
            fi
            if [[ "$status" -eq 2 ]]; then
              echo "::error::The action-returned release PR has an unexpected identity or state."
              exit 1
            fi
            echo "Attempt $attempt: exact release PR is not pending yet, retrying..."
          done
          if [[ "$status" -ne 0 ]]; then
            echo "::error::The exact release PR never acquired its pending label."
            exit 1
          fi
          echo "Auto-merging release PR #$PR"
          gh pr merge "$PR" --merge --delete-branch
          # The PAT-powered merge triggers a new workflow run where
          # the merged commit is independently gated before release creation.

      - id: context
        shell: bash
        env:
          MANUAL_TAG: ${{ needs.resolve-release-ref.outputs.tag_name }}
          GATED_RELEASE_REF: ${{ needs.gate-release-ref.outputs.release_ref }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          CANONICAL_TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          RELEASE_READY=false

          if [[ "$(git rev-parse --verify HEAD)" != "$GATED_RELEASE_REF" ]]; then
            echo "::error::Release preparation is not on the gated commit."
            exit 1
          fi

          if [[ -n "$MANUAL_TAG" ]]; then
            if [[ ! "$MANUAL_TAG" =~ $CANONICAL_TAG_RE ]]; then
              echo "::error::Manual rebuild tag is not canonical."
              exit 1
            fi
            TAG_NAME="$MANUAL_TAG"
            VERSION="${TAG_NAME#v}"
          else
            VERSION="$(python -I - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path(".github/.release-please-manifest.json").read_text(encoding="utf-8")
          ).get(".")
          if not isinstance(value, str) or not value:
              raise SystemExit("release manifest version is unavailable")
          print(value)
          PY
            )"
            TAG_NAME="v$VERSION"
          fi

          if [[ ! "$TAG_NAME" =~ $CANONICAL_TAG_RE ]]; then
            echo "::error::Resolved release tag is not canonical."
            exit 1
          fi
          python execution/version_sync.py check --tag "$TAG_NAME"

          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            TAG_COMMIT="$(git rev-parse --verify --end-of-options "refs/tags/${TAG_NAME}^{commit}")"
            if [[ "$TAG_COMMIT" == "$GATED_RELEASE_REF" ]]; then
              RELEASE_READY=true
            elif [[ -n "$MANUAL_TAG" ]]; then
              echo "::error::Manual rebuild tag does not point at the gated commit."
              exit 1
            elif git merge-base --is-ancestor "$TAG_COMMIT" "$GATED_RELEASE_REF"; then
              RELEASE_READY=false
            else
              echo "::error::Version tag is not on the gated commit's history."
              exit 1
            fi
          elif [[ -n "$MANUAL_TAG" ]]; then
            echo "::error::Manual rebuild tag does not exist."
            exit 1
          else
            RELEASE_READY=true
          fi

          echo "release_created=$RELEASE_READY" >> "$GITHUB_OUTPUT"
          echo "release_ref=$GATED_RELEASE_REF" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_READY" == "true" ]]; then
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release at the gated commit
        if: steps.context.outputs.release_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GATED_RELEASE_REF: ${{ needs.gate-release-ref.outputs.release_ref }}
          TAG_NAME: ${{ steps.context.outputs.tag_name }}
          MANUAL_TAG: ${{ needs.resolve-release-ref.outputs.tag_name }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            TAG_COMMIT="$(git rev-parse --verify --end-of-options "refs/tags/${TAG_NAME}^{commit}")"
            if [[ "$TAG_COMMIT" != "$GATED_RELEASE_REF" ]]; then
              echo "::error::Release tag moved away from the gated commit."
              exit 1
            fi
          fi

          RELEASE_PR=""
          if [[ -z "$MANUAL_TAG" ]]; then
            mapfile -t RELEASE_PRS < <(
              gh api "repos/$GH_REPO/commits/$GATED_RELEASE_REF/pulls" \
                --jq ".[] | select(.merge_commit_sha == \"$GATED_RELEASE_REF\") | select(any(.labels[]?; (.name == \"autorelease: pending\") or (.name == \"autorelease: tagged\"))) | .number" \
                | sort -u
            )
            if [[ "${#RELEASE_PRS[@]}" -ne 1 || ! "${RELEASE_PRS[0]}" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not resolve exactly one release PR for the gated commit."
              exit 1
            fi
            RELEASE_PR="${RELEASE_PRS[0]}"
          fi

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh api --method POST "repos/$GH_REPO/releases" \
              --raw-field tag_name="$TAG_NAME" \
              --raw-field target_commitish="$GATED_RELEASE_REF" \
              --raw-field name="$TAG_NAME" \
              --field generate_release_notes=true >/dev/null
          fi

          git fetch --tags --force
          TAG_COMMIT="$(git rev-parse --verify --end-of-options "refs/tags/${TAG_NAME}^{commit}")"
          if [[ "$TAG_COMMIT" != "$GATED_RELEASE_REF" ]]; then
            echo "::error::Created release tag does not point at the gated commit."
            exit 1
          fi

          # release-please's PR-only mode cannot perform its normal
          # pending-to-tagged transition. Bind that transition to the exact
          # gated merge commit, after its tag and GitHub release exist.
          if [[ -z "$MANUAL_TAG" ]]; then
            PR_LABELS="$(gh pr view "$RELEASE_PR" --json labels --jq '.labels[].name')"
            if grep -Fqx 'autorelease: pending' <<< "$PR_LABELS"; then
              gh pr edit "$RELEASE_PR" \
                --remove-label 'autorelease: pending' \
                --add-label 'autorelease: tagged' >/dev/null
            fi

            PR_LABELS="$(gh pr view "$RELEASE_PR" --json labels --jq '.labels[].name')"
            if grep -Fqx 'autorelease: pending' <<< "$PR_LABELS" \
              || ! grep -Fqx 'autorelease: tagged' <<< "$PR_LABELS"; then
              echo "::error::Release PR label transition did not complete."
              exit 1
            fi
          fi

  build:
    needs:
      - prepare-release
      - gate-release-ref
    if: ${{ !cancelled() && needs.gate-release-ref.result == 'success' && needs.prepare-release.result == 'success' && needs.prepare-release.outputs.release_created == 'true' }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: symforge-windows-x64.exe
            binary: target/x86_64-pc-windows-msvc/release/symforge.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: symforge-linux-x64
            binary: target/x86_64-unknown-linux-gnu/release/symforge
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: symforge-macos-arm64
            binary: target/aarch64-apple-darwin/release/symforge
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: symforge-macos-x64
            binary: target/x86_64-apple-darwin/release/symforge

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate-release-ref.outputs.release_ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify release versions
        run: python execution/version_sync.py check --tag "${{ needs.prepare-release.outputs.tag_name }}"

      # rust-toolchain.toml is the single source of truth for the toolchain
      # version; rustup resolves it natively (channel + components).
      - name: Install Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install && rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  build-npm-package:
    needs:
      - prepare-release
      - gate-release-ref
      - build
    if: ${{ !cancelled() && needs.gate-release-ref.result == 'success' && needs.prepare-release.result == 'success' && needs.build.result == 'success' && needs.prepare-release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate-release-ref.outputs.release_ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify release versions
        run: python execution/version_sync.py check --tag "${{ needs.prepare-release.outputs.tag_name }}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Synchronize npm package versions
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const platformPackages = {
            'linux-x64': 'symforge-linux-x64',
            'macos-arm64': 'symforge-macos-arm64',
            'macos-x64': 'symforge-macos-x64',
            'windows-x64': 'symforge-windows-x64',
          };

          const rootPath = 'npm/package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          root.version = version;
          root.optionalDependencies = Object.fromEntries(
            Object.values(platformPackages).map((name) => [name, version]),
          );
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n');

          for (const [dir, name] of Object.entries(platformPackages)) {
            const packagePath = `npm/platforms/${dir}/package.json`;
            const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
            pkg.name = name;
            pkg.version = version;
            fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');
          }
          NODE

      - name: Test npm package
        working-directory: npm
        run: npm test

      - name: Download built binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: symforge-*
          path: dist-binaries
          merge-multiple: true

      - name: Prepare platform npm packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p npm/platforms/windows-x64/bin
          mkdir -p npm/platforms/linux-x64/bin
          mkdir -p npm/platforms/macos-x64/bin
          mkdir -p npm/platforms/macos-arm64/bin

          cp dist-binaries/symforge-windows-x64.exe npm/platforms/windows-x64/bin/symforge.exe
          cp dist-binaries/symforge-linux-x64 npm/platforms/linux-x64/bin/symforge
          cp dist-binaries/symforge-macos-x64 npm/platforms/macos-x64/bin/symforge
          cp dist-binaries/symforge-macos-arm64 npm/platforms/macos-arm64/bin/symforge

          chmod 755 npm/platforms/linux-x64/bin/symforge
          chmod 755 npm/platforms/macos-x64/bin/symforge
          chmod 755 npm/platforms/macos-arm64/bin/symforge

          for dir in npm/platforms/*; do
            cp LICENSE "$dir/LICENSE"
          done

      - name: Build npm tarballs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist-npm
          npm pack ./npm --pack-destination dist-npm
          for dir in npm/platforms/*; do
            npm pack "$dir" --pack-destination dist-npm
          done
          ls -l dist-npm

      - name: Upload npm package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: dist-npm/*.tgz
          if-no-files-found: error

  upload-release-assets:
    needs:
      - prepare-release
      - gate-release-ref
      - build
      - build-npm-package
    if: ${{ !cancelled() && needs.gate-release-ref.result == 'success' && needs.prepare-release.result == 'success' && needs.build.result == 'success' && needs.build-npm-package.result == 'success' && needs.prepare-release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: symforge-*
          path: artifacts
          merge-multiple: true

      - name: Download npm package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.prepare-release.outputs.tag_name }}" artifacts/* --clobber

  cargo-publish:
    needs:
      - prepare-release
      - gate-release-ref
      - build
      - build-npm-package
      - upload-release-assets
    if: ${{ !cancelled() && needs.gate-release-ref.result == 'success' && needs.prepare-release.result == 'success' && needs.build.result == 'success' && needs.build-npm-package.result == 'success' && needs.upload-release-assets.result == 'success' && needs.prepare-release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: cargo-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate-release-ref.outputs.release_ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # rust-toolchain.toml is the single source of truth for the toolchain
      # version; rustup resolves it natively (channel + components).
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Publish to crates.io
        run: >
          python execution/release_ops.py publish-cargo
          --crate-name symforge
          --version "${{ needs.prepare-release.outputs.version }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm-publish:
    needs:
      - prepare-release
      - gate-release-ref
      - build-npm-package
      - upload-release-assets
    if: ${{ !cancelled() && needs.gate-release-ref.result == 'success' && needs.prepare-release.result == 'success' && needs.build-npm-package.result == 'success' && needs.upload-release-assets.result == 'success' && needs.prepare-release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate-release-ref.outputs.release_ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download npm package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: dist

      - name: Verify npm package artifact
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          for package in \
            symforge-windows-x64 \
            symforge-linux-x64 \
            symforge-macos-x64 \
            symforge-macos-arm64 \
            symforge
          do
            test -f "./dist/${package}-${VERSION}.tgz"
          done
          ls -l dist

      - name: Publish platform packages to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          for package in \
            symforge-windows-x64 \
            symforge-linux-x64 \
            symforge-macos-x64 \
            symforge-macos-arm64
          do
            python execution/release_ops.py publish-npm \
              --tarball "./dist/${package}-${VERSION}.tgz" \
              --package-name "$package" \
              --version "$VERSION"
          done

      - name: Publish root package to npm
        run: >
          python execution/release_ops.py publish-npm
          --tarball "./dist/symforge-${{ needs.prepare-release.outputs.version }}.tgz"
          --package-name symforge
          --version "${{ needs.prepare-release.outputs.version }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
