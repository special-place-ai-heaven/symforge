name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild or republish, for example v0.3.12
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  resolve-release-ref:
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      lifecycle_gate_active: ${{ steps.lifecycle-requirements.outputs.active }}
      lifecycle_requirements_sha256: ${{ steps.lifecycle-requirements.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: lifecycle-requirements
        name: Validate committed Feature 020 lifecycle release requirements
        shell: bash
        env:
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          REQUIREMENTS_PATH = ".github/release-evidence-requirements-v11.json"
          EXPECTED_FIELDS = {
              "kind",
              "phase",
              "required_oracle_receipts",
              "required_review_documents",
              "required_task_receipts",
              "schema_version",
          }

          def fail(message: str) -> None:
              raise SystemExit(message)

          def reject_duplicate_pairs(pairs: list[tuple[str, object]]) -> dict[str, object]:
              result: dict[str, object] = {}
              for key, value in pairs:
                  if key in result:
                      fail("lifecycle release requirements contain a duplicate key")
                  result[key] = value
              return result

          def reject_json_constant(_: str) -> object:
              fail("lifecycle release requirements contain a non-finite number")

          workflow_commit = os.environ["WORKFLOW_COMMIT"]
          if not re.fullmatch(r"[0-9a-f]{40}", workflow_commit):
              fail("the executing workflow commit is unavailable or malformed")
          environment = {
              key: value for key, value in os.environ.items() if not key.startswith("GIT_")
          }
          environment.update(
              {"GIT_NO_REPLACE_OBJECTS": "1", "GIT_OPTIONAL_LOCKS": "0", "LC_ALL": "C"}
          )

          def git(*arguments: str) -> bytes:
              completed = subprocess.run(
                  ["git", *arguments],
                  env=environment,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  shell=False,
                  check=False,
              )
              if completed.returncode != 0:
                  fail("cannot read the committed lifecycle release requirements")
              return completed.stdout

          if git("rev-parse", "--verify", f"{workflow_commit}^{{commit}}") != (
              workflow_commit + "\n"
          ).encode("ascii"):
              fail("the executing workflow commit is not canonical")
          tree_entry = git("ls-tree", "-z", workflow_commit, "--", REQUIREMENTS_PATH)
          expected_entry = re.compile(
              rb"100644 blob [0-9a-f]{40}\t"
              + re.escape(REQUIREMENTS_PATH.encode("ascii"))
              + rb"\x00"
          )
          if expected_entry.fullmatch(tree_entry) is None:
              fail("the lifecycle release requirements are absent or not a regular file")
          blob = git("cat-file", "blob", f"{workflow_commit}:{REQUIREMENTS_PATH}")
          try:
              requirements = json.loads(
                  blob.decode("utf-8"),
                  object_pairs_hook=reject_duplicate_pairs,
                  parse_constant=reject_json_constant,
              )
          except (UnicodeDecodeError, json.JSONDecodeError, TypeError) as error:
              raise SystemExit("lifecycle release requirements are not strict UTF-8 JSON") from error
          if (
              not isinstance(requirements, dict)
              or set(requirements) != EXPECTED_FIELDS
              or requirements.get("kind")
              != "symforge.lifecycle_release_evidence_requirements.v11"
              or not isinstance(requirements.get("schema_version"), int)
              or isinstance(requirements.get("schema_version"), bool)
              or requirements.get("schema_version") != 1
              or requirements.get("phase") not in ("pre_activation", "active")
          ):
              fail("lifecycle release requirements have an invalid closed schema")

          def validate_paths(name: str, pattern: str) -> list[str]:
              values = requirements.get(name)
              if (
                  not isinstance(values, list)
                  or any(not isinstance(value, str) for value in values)
                  or values != sorted(values)
                  or len(values) != len(set(values))
                  or any(re.fullmatch(pattern, value) is None for value in values)
              ):
                  fail(f"{name} is not a sorted, unique, closed path set")
              return values

          oracle_receipts = validate_paths(
              "required_oracle_receipts",
              r"target/ci/lifecycle-v11/[a-z0-9][a-z0-9._-]*\.json",
          )
          review_documents = validate_paths(
              "required_review_documents",
              r"docs/reviews/[A-Za-z0-9][A-Za-z0-9._-]*\.md",
          )
          task_receipts = validate_paths(
              "required_task_receipts",
              r"target/ci/lifecycle-v11/task-T[0-9]{3}\.json",
          )
          if set(oracle_receipts) & set(task_receipts):
              fail("lifecycle receipt categories overlap")
          reserved_receipts = {
              "target/ci/lifecycle-v11/refreeze-approval-result.json",
              "target/ci/lifecycle-v11/release-evidence.json",
              "target/ci/lifecycle-v11/task-T089.json",
          }
          if reserved_receipts & (set(oracle_receipts) | set(task_receipts)):
              fail("pre-approval requirements contain causally premature evidence")
          phase = requirements["phase"]
          declared_sets = (oracle_receipts, review_documents, task_receipts)
          if phase == "pre_activation" and any(declared_sets):
              fail("pre-activation lifecycle requirements must declare zero evidence")
          if phase == "active" and not all(declared_sets):
              fail("active lifecycle requirements must declare every closed evidence set")
          if phase == "active" and review_documents != [
              "docs/reviews/FEATURE-020-V11-RELEASE-GATE.md"
          ]:
              fail("active lifecycle requirements do not close the release-gate review")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8", newline="\n") as handle:
              handle.write(f"active={'true' if phase == 'active' else 'false'}\n")
              handle.write(f"sha256={hashlib.sha256(blob).hexdigest()}\n")
          PY

      - id: resolve
        name: Resolve immutable release candidate
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          git fetch --no-tags --force origin \
            '+refs/heads/main:refs/remotes/origin/main'

          if [[ "$WORKFLOW_EVENT" == "workflow_dispatch" \
              && "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual release dispatch must run from refs/heads/main."
            exit 1
          fi

          CANONICAL_TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ -n "$MANUAL_TAG" ]]; then
            if [[ ! "$MANUAL_TAG" =~ $CANONICAL_TAG_RE ]]; then
              echo "::error::Manual rebuild tag is not canonical."
              exit 1
            fi
            RELEASE_REF="$(git rev-parse --verify --end-of-options "refs/tags/${MANUAL_TAG}^{commit}" 2>/dev/null)" || {
              echo "::error::Manual rebuild tag does not resolve to a commit."
              exit 1
            }
            if ! git merge-base --is-ancestor "$RELEASE_REF" "refs/remotes/origin/main"; then
              echo "::error::Manual rebuild tag is not reachable from origin/main."
              exit 1
            fi
            echo "tag_name=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
          else
            RELEASE_REF="$(git rev-parse --verify --end-of-options "${GITHUB_SHA}^{commit}" 2>/dev/null)" || {
              echo "::error::Workflow commit does not resolve."
              exit 1
            }
            echo "tag_name=" >> "$GITHUB_OUTPUT"
          fi

          echo "release_ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"

  verify-release-ref:
    needs: resolve-release-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-ref.outputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Free disk space for Rust builds
        run: bash execution/free_runner_disk.sh

      - name: Validate commit subjects for this push
        if: github.event_name == 'push'
        run: python execution/conventional_commits.py check-push-range "${{ github.event.before }}" "$GITHUB_SHA"

      - name: Validate manual run resolved tag commit subject
        if: github.event_name == 'workflow_dispatch'
        run: python execution/conventional_commits.py check-range "HEAD^!"

      - name: Run version sync tests
        env:
          SYMFORGE_REQUIRE_SSHSIG: '1'
        run: python -m unittest discover -s execution -p 'test_*.py'

      - name: Verify Feature 020 V11 refreeze integrity
        if: needs.resolve-release-ref.outputs.lifecycle_gate_active == 'true'
        run: python execution/refreeze_v11.py verify-internal --target-ref HEAD

      - name: Test and verify Feature 020 V11 lifecycle traceability
        if: needs.resolve-release-ref.outputs.lifecycle_gate_active == 'true'
        run: |
          node scripts/validate-lifecycle-oracle-traceability.test.cjs
          node scripts/validate-lifecycle-oracle-traceability.cjs

      # rust-toolchain.toml is the single source of truth for the toolchain
      # version; rustup resolves it natively (channel + components).
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Run cargo check
        run: cargo check

      - name: Clone phase0 golden-replay corpora
        run: bash execution/clone_phase0_corpora.sh

      - name: Run Rust tests
        run: cargo test --all-targets -- --test-threads=1

      - name: Build release binary on main pushes
        run: cargo build --release

      # Engine-only build for library embedders (e.g. AAP). ci.yml runs the same
      # gate on PRs; this mirrors it on main pushes so a server-only break (e.g. a
      # `#[cfg(unix)]` path cfg'd out on the contributor's OS) can never reach an
      # embedder via main.
      - name: Build engine-only embed feature
        run: cargo build --no-default-features --features embed

      - name: Run embed-feature lib tests
        run: cargo test --no-default-features --features embed --lib -- --test-threads=1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Test npm package
        working-directory: npm
        run: npm test

      # Mirror ci.yml's tool-correctness gate onto the release path. ci.yml gates
      # PRs; without this a harness regression that lands via a non-PR push (or a
      # release-please merge) could reach a cut release unverified. Reuses the
      # Node set up above and the release binary built at "Build release binary
      # on main pushes". ripgrep backs the harness grep oracle (not on ubuntu).
      - name: Install ripgrep (harness grep oracle)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Verify tool correctness (both fixtures)
        run: |
          node scripts/verify-tools.cjs --bin target/release/symforge
          node scripts/verify-tools.cjs --fixture verify-tools-real --bin target/release/symforge

      # T078-T088 produce the code-owned execution bundle. T089 is deliberately
      # absent here: it can only be assembled after the external approval below
      # has actually been verified against the approved ancestor.
      - name: Require code-owned Feature 020 V11 pre-approval evidence
        if: needs.resolve-release-ref.outputs.lifecycle_gate_active == 'true'
        shell: bash
        env:
          EXPECTED_REQUIREMENTS_SHA256: ${{ needs.resolve-release-ref.outputs.lifecycle_requirements_sha256 }}
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          bundle = workspace / "target/ci/lifecycle-v11"
          requirements_path = workspace / ".github/release-evidence-requirements-v11.json"

          def fail(message: str) -> None:
              print(f"::error::{message}", file=sys.stderr)
              raise SystemExit(1)

          def reject_duplicate_pairs(pairs: list[tuple[str, object]]) -> dict[str, object]:
              result: dict[str, object] = {}
              for key, value in pairs:
                  if key in result:
                      fail("The lifecycle release requirements contain a duplicate key.")
                  result[key] = value
              return result

          if not requirements_path.is_file() or requirements_path.is_symlink():
              fail("The lifecycle release requirements are unavailable or unsafe.")
          requirements_bytes = requirements_path.read_bytes()
          if (
              hashlib.sha256(requirements_bytes).hexdigest()
              != os.environ["EXPECTED_REQUIREMENTS_SHA256"]
          ):
              fail("The lifecycle release requirements differ from the executing workflow.")
          try:
              requirements = json.loads(
                  requirements_bytes.decode("utf-8"),
                  object_pairs_hook=reject_duplicate_pairs,
                  parse_constant=lambda _: fail(
                      "The lifecycle release requirements contain a non-finite number."
                  ),
              )
          except (UnicodeDecodeError, json.JSONDecodeError, TypeError) as error:
              raise SystemExit(
                  "The lifecycle release requirements are not strict UTF-8 JSON."
              ) from error
          if not isinstance(requirements, dict) or requirements.get("phase") != "active":
              fail("The lifecycle release requirements are not active.")
          task_receipts = requirements.get("required_task_receipts")
          oracle_receipts = requirements.get("required_oracle_receipts")
          if not isinstance(task_receipts, list) or not isinstance(oracle_receipts, list):
              fail("The lifecycle release receipt sets are malformed.")
          expected_files = set(task_receipts) | set(oracle_receipts)

          if not bundle.is_dir() or bundle.is_symlink() or bundle.resolve() != bundle:
              fail("The code-owned pre-approval evidence directory is unavailable or unsafe.")
          for parent in (workspace / "target", workspace / "target/ci", bundle):
              if parent.is_symlink():
                  fail("The code-owned pre-approval evidence path contains a symbolic link.")
          for path in bundle.rglob("*"):
              if path.is_symlink():
                  fail("The code-owned pre-approval evidence bundle contains a symbolic link.")

          actual_files = {
              path.relative_to(workspace).as_posix()
              for path in bundle.rglob("*")
              if path.is_file()
          }
          if actual_files != expected_files:
              fail("The code-owned pre-approval evidence does not match the closed requirements.")

          for name in (
              "refreeze-approval-result.json",
              "task-T089.json",
              "release-evidence.json",
          ):
              path = bundle / name
              if path.exists() or path.is_symlink():
                  fail("Pre-approval evidence contains causally premature T089 material.")
          PY

      - name: Upload code-owned Feature 020 V11 pre-approval evidence
        if: needs.resolve-release-ref.outputs.lifecycle_gate_active == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-020-v11-preapproval-evidence
          path: target/ci/lifecycle-v11/
          if-no-files-found: error
          retention-days: 1

  feature-020-v11-gate:
    needs:
      - resolve-release-ref
      - verify-release-ref
    if: needs.resolve-release-ref.outputs.lifecycle_gate_active == 'true'
    runs-on: ubuntu-latest
    environment: feature-020-v11-release-approval
    permissions:
      actions: read
      contents: read
    outputs:
      release_ref: ${{ steps.gate.outputs.release_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-ref.outputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - id: trusted-tools
        name: Resolve trusted gate executables outside the repository
        shell: bash
        run: |
          set -euo pipefail

          resolve_tool() {
            local name="$1"
            local candidate
            local canonical
            candidate="$(command -v -- "$name")" || {
              echo "::error::A required gate executable is unavailable."
              exit 1
            }
            if [[ "$candidate" != /* ]]; then
              echo "::error::A required gate executable did not resolve to an absolute path."
              exit 1
            fi
            canonical="$(/usr/bin/readlink -f -- "$candidate")" || {
              echo "::error::A required gate executable could not be canonicalized."
              exit 1
            }
            if [[ ! -f "$canonical" || ! -x "$canonical" \
                || "$canonical" == "$GITHUB_WORKSPACE" \
                || "$canonical" == "$GITHUB_WORKSPACE"/* \
                || "$canonical" == "$RUNNER_TEMP" \
                || "$canonical" == "$RUNNER_TEMP"/* ]]; then
              echo "::error::A required gate executable is not a trusted external file."
              exit 1
            fi
            printf '%s' "$canonical"
          }

          echo "git=$(resolve_tool git)" >> "$GITHUB_OUTPUT"
          echo "ssh_keygen=$(resolve_tool ssh-keygen)" >> "$GITHUB_OUTPUT"
          echo "python=$(resolve_tool python)" >> "$GITHUB_OUTPUT"
          echo "node=$(resolve_tool node)" >> "$GITHUB_OUTPUT"
          echo "cargo=$(resolve_tool cargo)" >> "$GITHUB_OUTPUT"

          IFS=':' read -r -a path_entries <<< "$PATH"
          safe_path=""
          for entry in "${path_entries[@]}"; do
            if [[ "$entry" != /* ]]; then
              echo "::error::The gate PATH contains a non-absolute entry."
              exit 1
            fi
            canonical="$(/usr/bin/readlink -f -- "$entry")" || {
              echo "::error::A gate PATH entry could not be canonicalized."
              exit 1
            }
            if [[ ! -d "$canonical" \
                || "$canonical" == "$GITHUB_WORKSPACE" \
                || "$canonical" == "$GITHUB_WORKSPACE"/* \
                || "$canonical" == "$RUNNER_TEMP" \
                || "$canonical" == "$RUNNER_TEMP"/* ]]; then
              echo "::error::The gate PATH contains an unsafe entry."
              exit 1
            fi
            safe_path="${safe_path:+$safe_path:}$canonical"
          done
          echo "safe_path=$safe_path" >> "$GITHUB_OUTPUT"

      - name: Download code-owned Feature 020 V11 pre-approval evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: feature-020-v11-preapproval-evidence
          path: target/ci/lifecycle-v11

      - name: Revalidate the downloaded pre-approval evidence boundary
        shell: bash
        env:
          EXPECTED_REQUIREMENTS_SHA256: ${{ needs.resolve-release-ref.outputs.lifecycle_requirements_sha256 }}
          TRUSTED_PYTHON: ${{ steps.trusted-tools.outputs.python }}
        run: |
          set -euo pipefail
          "$TRUSTED_PYTHON" -I - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          bundle = workspace / "target/ci/lifecycle-v11"
          requirements_path = workspace / ".github/release-evidence-requirements-v11.json"

          def fail(message: str) -> None:
              print(f"::error::{message}", file=sys.stderr)
              raise SystemExit(1)

          def reject_duplicate_pairs(pairs: list[tuple[str, object]]) -> dict[str, object]:
              result: dict[str, object] = {}
              for key, value in pairs:
                  if key in result:
                      fail("Downloaded requirements contain a duplicate key.")
                  result[key] = value
              return result

          if not requirements_path.is_file() or requirements_path.is_symlink():
              fail("The lifecycle release requirements are unavailable or unsafe.")
          requirements_bytes = requirements_path.read_bytes()
          if (
              hashlib.sha256(requirements_bytes).hexdigest()
              != os.environ["EXPECTED_REQUIREMENTS_SHA256"]
          ):
              fail("The lifecycle release requirements differ from the executing workflow.")
          try:
              requirements = json.loads(
                  requirements_bytes.decode("utf-8"),
                  object_pairs_hook=reject_duplicate_pairs,
                  parse_constant=lambda _: fail(
                      "Downloaded requirements contain a non-finite number."
                  ),
              )
          except (UnicodeDecodeError, json.JSONDecodeError, TypeError) as error:
              raise SystemExit("Downloaded requirements are not strict UTF-8 JSON.") from error
          if not isinstance(requirements, dict) or requirements.get("phase") != "active":
              fail("The lifecycle release requirements are not active.")
          task_receipts = requirements.get("required_task_receipts")
          oracle_receipts = requirements.get("required_oracle_receipts")
          if not isinstance(task_receipts, list) or not isinstance(oracle_receipts, list):
              fail("The lifecycle release receipt sets are malformed.")
          expected_files = set(task_receipts) | set(oracle_receipts)

          if not bundle.is_dir() or bundle.is_symlink() or bundle.resolve() != bundle:
              fail("The downloaded pre-approval evidence directory is unavailable or unsafe.")
          for parent in (workspace / "target", workspace / "target/ci", bundle):
              if parent.is_symlink():
                  fail("The downloaded pre-approval evidence path contains a symbolic link.")
          for path in bundle.rglob("*"):
              if path.is_symlink():
                  fail("The downloaded pre-approval evidence contains a symbolic link.")
          actual_files = {
              path.relative_to(workspace).as_posix()
              for path in bundle.rglob("*")
              if path.is_file()
          }
          if actual_files != expected_files:
              fail("Downloaded evidence does not match the closed requirements.")
          for name in (
              "refreeze-approval-result.json",
              "task-T089.json",
              "release-evidence.json",
          ):
              path = bundle / name
              if path.exists() or path.is_symlink():
                  fail("Downloaded evidence contains causally premature T089 material.")
          PY

      - name: Bind the executing workflow to the gated release tree
        shell: bash
        env:
          EXECUTING_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GATED_RELEASE_REF: ${{ needs.resolve-release-ref.outputs.release_ref }}
          TRUSTED_GIT: ${{ steps.trusted-tools.outputs.git }}
          TRUSTED_PYTHON: ${{ steps.trusted-tools.outputs.python }}
        run: |
          set -euo pipefail
          if [[ -z "$EXECUTING_WORKFLOW_SHA" ]]; then
            echo "::error::The executing workflow commit is unavailable."
            exit 1
          fi
          if [[ "$("$TRUSTED_GIT" rev-parse --verify --end-of-options "${EXECUTING_WORKFLOW_SHA}^{commit}" 2>/dev/null)" != "$EXECUTING_WORKFLOW_SHA" ]]; then
            echo "::error::The executing workflow commit is not canonical."
            exit 1
          fi

          EXECUTING_WORKFLOW="$RUNNER_TEMP/executing-release-workflow.yml"
          if [[ -e "$EXECUTING_WORKFLOW" || -L "$EXECUTING_WORKFLOW" ]]; then
            echo "::error::The executing-workflow comparison path already exists."
            exit 1
          fi
          "$TRUSTED_GIT" show "${EXECUTING_WORKFLOW_SHA}:.github/workflows/release.yml" > "$EXECUTING_WORKFLOW"
          if ! "$TRUSTED_PYTHON" -I - "$EXECUTING_WORKFLOW" <<'PY'
          import sys
          from pathlib import Path

          raise SystemExit(Path(sys.argv[1]).read_bytes() != Path(".github/workflows/release.yml").read_bytes())
          PY
          then
            echo "::error::The executing workflow is not byte-identical to the gated release workflow."
            exit 1
          fi
          "$TRUSTED_PYTHON" -I - "$EXECUTING_WORKFLOW" <<'PY'
          import sys
          from pathlib import Path

          Path(sys.argv[1]).unlink()
          PY

      - id: gate
        name: Verify signed refreeze ancestor and emit the closed approval result
        shell: bash
        env:
          APPROVAL_RECORD_B64: ${{ secrets.FEATURE_020_V11_APPROVAL_RECORD_B64 }}
          APPROVAL_SIGNATURE_B64: ${{ secrets.FEATURE_020_V11_APPROVAL_SIGNATURE_B64 }}
          ALLOWED_SIGNERS_B64: ${{ secrets.FEATURE_020_V11_ALLOWED_SIGNERS_B64 }}
          APPROVAL_HISTORY_ZIP_B64: ${{ secrets.FEATURE_020_V11_APPROVAL_HISTORY_ZIP_B64 }}
          BASH_ENV: ''
          ENV: ''
          EXPECTED_RELEASE_IDENTITY: ${{ vars.FEATURE_020_V11_RELEASE_IDENTITY }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          GATED_RELEASE_REF: ${{ needs.resolve-release-ref.outputs.release_ref }}
          PATH: ${{ steps.trusted-tools.outputs.safe_path }}
          PYTHONHOME: ''
          PYTHONPATH: ''
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_JOB: ${{ github.job }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          TRUSTED_GIT: ${{ steps.trusted-tools.outputs.git }}
          TRUSTED_PYTHON: ${{ steps.trusted-tools.outputs.python }}
          TRUSTED_SSH_KEYGEN: ${{ steps.trusted-tools.outputs.ssh_keygen }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "$EXPECTED_RELEASE_IDENTITY" ]]; then
            echo "::error::Required GitHub Environment release identity is unavailable."
            exit 1
          fi
          if [[ "$EXPECTED_REPOSITORY" != "special-place-ai-heaven/symforge" ]]; then
            echo "::error::The release approval gate is running for an unexpected repository."
            exit 1
          fi
          if [[ "$("$TRUSTED_GIT" rev-parse --verify HEAD)" != "$GATED_RELEASE_REF" ]]; then
            echo "::error::Checked-out tree does not match the resolved release commit."
            exit 1
          fi

          MATERIAL_DIR="$RUNNER_TEMP/feature-020-v11-release-approval"
          if [[ -e "$MATERIAL_DIR" || -L "$MATERIAL_DIR" ]]; then
            echo "::error::External approval material directory already exists."
            exit 1
          fi
          mkdir -p "$MATERIAL_DIR/history"
          export MATERIAL_DIR

          cleanup_material() {
            "$TRUSTED_PYTHON" -I - "$MATERIAL_DIR" <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path

          material = Path(sys.argv[1]).resolve()
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          if material.parent != runner_temp or material.name != "feature-020-v11-release-approval":
              raise SystemExit("refusing to remove an unexpected approval material path")
          if material.exists():
              shutil.rmtree(material)
          PY
          }
          trap cleanup_material EXIT

          "$TRUSTED_PYTHON" -I - <<'PY'
          import base64
          import binascii
          import io
          import json
          import os
          import re
          import sys
          import zipfile
          from pathlib import Path

          root = Path(os.environ["MATERIAL_DIR"])
          max_file_bytes = 1_048_576
          max_history_bytes = 8_388_608

          def fail(message: str) -> None:
              print(f"::error::{message}", file=sys.stderr)
              raise SystemExit(1)

          def decode(name: str, destination: Path, *, required: bool = True) -> bytes:
              encoded = os.environ.get(name, "")
              if not encoded:
                  if required:
                      fail(f"Required GitHub Environment input {name} is unavailable.")
                  return b""
              try:
                  value = base64.b64decode(encoded, validate=True)
              except (binascii.Error, ValueError):
                  fail(f"GitHub Environment input {name} is not valid base64.")
              if not value:
                  fail(f"GitHub Environment input {name} decoded to an empty file.")
              if len(value) > max_history_bytes:
                  fail(f"GitHub Environment input {name} exceeds the size limit.")
              destination.write_bytes(value)
              return value

          record_bytes = decode("APPROVAL_RECORD_B64", root / "approval.json")
          decode("APPROVAL_SIGNATURE_B64", root / "approval.json.sig")
          decode("ALLOWED_SIGNERS_B64", root / "allowed_signers")

          def reject_duplicate_pairs(pairs: list[tuple[str, object]]) -> dict[str, object]:
              result: dict[str, object] = {}
              for key, value in pairs:
                  if key in result:
                      fail("External approval record contains a duplicate JSON key.")
                  result[key] = value
              return result

          def reject_json_constant(_: str) -> object:
              fail("External approval record contains a non-finite JSON number.")

          try:
              record = json.loads(
                  record_bytes.decode("utf-8"),
                  object_pairs_hook=reject_duplicate_pairs,
                  parse_constant=reject_json_constant,
              )
              approved_target = record["target_commit"]
          except (KeyError, UnicodeDecodeError, json.JSONDecodeError, TypeError):
              fail("External approval record cannot identify its target commit.")
          if not isinstance(approved_target, str) or not re.fullmatch(
              r"[0-9a-f]{40}", approved_target
          ):
              fail("External approval target commit is malformed.")
          (root / "approved-target").write_text(approved_target + "\n", encoding="ascii")

          history_bytes = decode(
              "APPROVAL_HISTORY_ZIP_B64",
              root / "approval-history.zip",
              required=False,
          )
          if history_bytes:
              try:
                  archive = zipfile.ZipFile(io.BytesIO(history_bytes))
              except zipfile.BadZipFile:
                  fail("External approval history is not a valid ZIP archive.")
              with archive:
                  infos = archive.infolist()
                  if len(infos) > 256:
                      fail("External approval history contains too many files.")
                  names: set[str] = set()
                  total = 0
                  for info in infos:
                      name = info.filename
                      if (
                          info.is_dir()
                          or name in names
                          or not re.fullmatch(r"[0-9a-f]{64}\.json(?:\.sig)?", name)
                      ):
                          fail("External approval history contains an invalid entry.")
                      names.add(name)
                      try:
                          with archive.open(info) as source:
                              value = source.read(max_file_bytes + 1)
                              trailing = source.read(1)
                      except (RuntimeError, zipfile.BadZipFile):
                          fail("External approval history contains an unreadable entry.")
                      if len(value) > max_file_bytes or trailing:
                          fail("External approval history entry exceeds the size limit.")
                      total += len(value)
                      if total > max_history_bytes:
                          fail("External approval history exceeds the size limit.")
                      (root / "history" / name).write_bytes(value)
          PY

          unset APPROVAL_RECORD_B64 APPROVAL_SIGNATURE_B64 ALLOWED_SIGNERS_B64
          unset APPROVAL_HISTORY_ZIP_B64
          APPROVED_TARGET="$(<"$MATERIAL_DIR/approved-target")"

          if ! "$TRUSTED_SSH_KEYGEN" -Y verify \
            -f "$MATERIAL_DIR/allowed_signers" \
            -I "$EXPECTED_RELEASE_IDENTITY" \
            -n symforge-feature-020-refreeze-v11 \
            -s "$MATERIAL_DIR/approval.json.sig" \
            < "$MATERIAL_DIR/approval.json" >/dev/null 2>&1; then
            echo "::error::External approval signature is invalid."
            exit 1
          fi

          "$TRUSTED_GIT" show "${APPROVED_TARGET}:execution/refreeze_v11.py" \
            > "$MATERIAL_DIR/refreeze_v11.py"
          if ! "$TRUSTED_PYTHON" -I "$MATERIAL_DIR/refreeze_v11.py" \
              --git-executable "$TRUSTED_GIT" \
              --root "$GITHUB_WORKSPACE" \
              verify-approval \
              --target-ref "$APPROVED_TARGET" \
              --approval-record "$MATERIAL_DIR/approval.json" \
              --approval-signature "$MATERIAL_DIR/approval.json.sig" \
              --approval-history-dir "$MATERIAL_DIR/history" \
              --allowed-signers "$MATERIAL_DIR/allowed_signers" \
              --ssh-keygen-executable "$TRUSTED_SSH_KEYGEN" \
              --expected-release-identity "$EXPECTED_RELEASE_IDENTITY" \
              --expected-repository "$EXPECTED_REPOSITORY" \
              > "$MATERIAL_DIR/verify-approval.stdout" \
              2> "$MATERIAL_DIR/verify-approval.stderr"; then
            echo "::error::External refreeze approval verification failed."
            exit 1
          fi
          "$TRUSTED_PYTHON" -I - \
            "$MATERIAL_DIR/verify-approval.stdout" \
            "$MATERIAL_DIR/verify-approval.stderr" <<'PY'
          import sys
          from pathlib import Path

          expected = b"Feature 020 V11 external approval verification passed.\n"
          if Path(sys.argv[1]).read_bytes() != expected or Path(sys.argv[2]).read_bytes():
              raise SystemExit("external approval verifier returned unexpected output")
          PY

          if [[ "$APPROVED_TARGET" == "$GATED_RELEASE_REF" ]] \
            || ! "$TRUSTED_GIT" merge-base --is-ancestor "$APPROVED_TARGET" "$GATED_RELEASE_REF"; then
            echo "::error::The signed refreeze target is not a strict ancestor of the release candidate."
            exit 1
          fi

          FROZEN_PATHS=(
            .gitattributes
            .github/CODEOWNERS
            .github/release-evidence-requirements-v11.json
            .github/workflows/ci.yml
            .github/workflows/release.yml
            CONTEXT.md
            docs/reviews/FEATURE-020-REFREEZE-ATTESTATION-v11.md
            docs/reviews/FEATURE-020-V11-RELEASE-GATE.md
            docs/superpowers/specs/2026-08-11-project-index-lifecycle-prevention-design.md
            execution/refreeze_v11.py
            execution/test_refreeze_v11.py
            scripts/validate-lifecycle-oracle-traceability.cjs
            scripts/validate-lifecycle-oracle-traceability.test.cjs
            specs/020-repository-knowledge-index
            tests/fixtures/public-api-v11-consumer
          )
          if ! "$TRUSTED_GIT" diff --quiet --no-ext-diff --no-textconv \
            "$APPROVED_TARGET^{tree}" \
            "$GATED_RELEASE_REF^{tree}" \
            -- "${FROZEN_PATHS[@]}"; then
            echo "::error::The release candidate rewrites the approved frozen corpus or gate executables."
            exit 1
          fi

          "$TRUSTED_PYTHON" -I "$MATERIAL_DIR/refreeze_v11.py" \
            --git-executable "$TRUSTED_GIT" \
            --root "$GITHUB_WORKSPACE" \
            verify-internal \
            --target-ref "$GATED_RELEASE_REF"

          APPROVED_TREE="$("$TRUSTED_GIT" rev-parse --verify "${APPROVED_TARGET}^{tree}")"
          RELEASE_TREE="$("$TRUSTED_GIT" rev-parse --verify "${GATED_RELEASE_REF}^{tree}")"
          APPROVAL_RESULT="target/ci/lifecycle-v11/refreeze-approval-result.json"
          "$TRUSTED_PYTHON" -I - \
            "$APPROVED_TARGET" \
            "$APPROVED_TREE" \
            "$GATED_RELEASE_REF" \
            "$RELEASE_TREE" \
            "$MATERIAL_DIR" \
            "$APPROVAL_RESULT" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          approved_commit, approved_tree, release_commit, release_tree = sys.argv[1:5]
          material_argument = sys.argv[5]
          material = Path(material_argument).resolve(strict=True)
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          bundle = workspace / "target/ci/lifecycle-v11"
          result_path = (workspace / sys.argv[6]).resolve(strict=False)

          def fail(message: str) -> None:
              raise SystemExit(message)

          if (
              not bundle.is_dir()
              or bundle.is_symlink()
              or bundle.resolve(strict=True) != bundle
              or result_path.parent != bundle
              or result_path.exists()
              or result_path.is_symlink()
          ):
              fail("refusing to write the approval result to an unsafe path")

          def sha256_bytes(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()

          def canonical_json(value: object) -> bytes:
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")

          def canonical_digest(domain: str, value: object) -> str:
              return sha256_bytes(domain.encode("utf-8") + b"\0" + canonical_json(value))

          def reject_duplicate_pairs(
              pairs: list[tuple[str, object]],
          ) -> dict[str, object]:
              result: dict[str, object] = {}
              for key, value in pairs:
                  if key in result:
                      fail("an approval record contains a duplicate JSON key")
                  result[key] = value
              return result

          def reject_json_constant(_: str) -> object:
              fail("an approval record contains a non-finite JSON number")

          def parse_record(value: bytes) -> dict[str, object]:
              try:
                  record = json.loads(
                      value.decode("utf-8"),
                      object_pairs_hook=reject_duplicate_pairs,
                      parse_constant=reject_json_constant,
                  )
              except (UnicodeDecodeError, json.JSONDecodeError, TypeError) as error:
                  raise SystemExit("an approval record is not valid JSON") from error
              if not isinstance(record, dict):
                  fail("an approval record is not a JSON object")
              return record

          def read(name: str) -> bytes:
              path = material / name
              if not path.is_file() or path.is_symlink():
                  fail("a required approval-verification input is unavailable")
              return path.read_bytes()

          approved_verifier = read("refreeze_v11.py")
          release_verifier = (workspace / "execution/refreeze_v11.py").read_bytes()
          if approved_verifier != release_verifier:
              fail("the approved and release verifier bytes differ")
          release_workflow = (workspace / ".github/workflows/release.yml").read_bytes()

          current_record_bytes = read("approval.json")
          current_signature_bytes = read("approval.json.sig")
          current_record = parse_record(current_record_bytes)
          approval_sequence = current_record.get("sequence")
          approval_predecessor = current_record.get("predecessor_digest")
          if (
              not isinstance(approval_sequence, int)
              or isinstance(approval_sequence, bool)
              or not 1 <= approval_sequence <= 256
          ):
              fail("the verified approval sequence is invalid")

          history_directory = material / "history"
          history_inventory_descending: list[dict[str, object]] = []
          expected_history_files: set[str] = set()
          predecessor = approval_predecessor
          for sequence in range(approval_sequence - 1, 0, -1):
              if not isinstance(predecessor, str) or len(predecessor) != 64:
                  fail("the verified approval predecessor chain is invalid")
              record_name = f"{predecessor}.json"
              signature_name = f"{predecessor}.json.sig"
              expected_history_files.update((record_name, signature_name))
              record_path = history_directory / record_name
              signature_path = history_directory / signature_name
              if (
                  not record_path.is_file()
                  or record_path.is_symlink()
                  or not signature_path.is_file()
                  or signature_path.is_symlink()
              ):
                  fail("a verified approval-history entry is unavailable")
              predecessor_bytes = record_path.read_bytes()
              signature_bytes = signature_path.read_bytes()
              if sha256_bytes(predecessor_bytes) != predecessor:
                  fail("a verified approval-history digest changed")
              predecessor_record = parse_record(predecessor_bytes)
              if predecessor_record.get("sequence") != sequence:
                  fail("the verified approval-history sequence changed")
              history_inventory_descending.append(
                  {
                      "record_sha256": predecessor,
                      "sequence": sequence,
                      "signature_sha256": sha256_bytes(signature_bytes),
                  }
              )
              predecessor = predecessor_record.get("predecessor_digest")
          if predecessor is not None:
              fail("the verified approval-history root is invalid")
          actual_history_files = {
              path.name for path in history_directory.iterdir() if path.is_file()
          }
          if actual_history_files != expected_history_files:
              fail("the external approval history contains unbound files")
          approval_history = sorted(
              history_inventory_descending, key=lambda entry: entry["sequence"]
          )
          history_inventory_sha256 = canonical_digest(
              "symforge.refreeze.v11.approval-history-inventory",
              approval_history,
          )
          current_record_sha256 = sha256_bytes(current_record_bytes)
          current_signature_sha256 = sha256_bytes(current_signature_bytes)
          history_root_sha256 = canonical_digest(
              "symforge.refreeze.v11.approval-history-root",
              {
                  "approval_history_count": len(approval_history),
                  "approval_history_inventory_sha256": history_inventory_sha256,
                  "approval_predecessor_digest": approval_predecessor,
                  "approval_sequence": approval_sequence,
                  "current_record_sha256": current_record_sha256,
                  "current_signature_sha256": current_signature_sha256,
              },
          )
          verifier_argv = [
              os.environ["TRUSTED_PYTHON"],
              "-I",
              f"{material_argument}/refreeze_v11.py",
              "--git-executable",
              os.environ["TRUSTED_GIT"],
              "--root",
              os.environ["GITHUB_WORKSPACE"],
              "verify-approval",
              "--target-ref",
              approved_commit,
              "--approval-record",
              f"{material_argument}/approval.json",
              "--approval-signature",
              f"{material_argument}/approval.json.sig",
              "--approval-history-dir",
              f"{material_argument}/history",
              "--allowed-signers",
              f"{material_argument}/allowed_signers",
              "--ssh-keygen-executable",
              os.environ["TRUSTED_SSH_KEYGEN"],
              "--expected-release-identity",
              os.environ["EXPECTED_RELEASE_IDENTITY"],
              "--expected-repository",
              os.environ["EXPECTED_REPOSITORY"],
          ]

          result = {
              "allowed_signers_sha256": sha256_bytes(read("allowed_signers")),
              "approved_commit": approved_commit,
              "approved_tree": approved_tree,
              "approval_history_count": len(approval_history),
              "approval_history_inventory": approval_history,
              "approval_history_inventory_sha256": history_inventory_sha256,
              "approval_history_root_sha256": history_root_sha256,
              "approval_predecessor_digest": approval_predecessor,
              "approval_sequence": approval_sequence,
              "command_id": "refreeze-v11-verify-approval",
              "command_argv_sha256": sha256_bytes(canonical_json(verifier_argv)),
              "exit_code": 0,
              "expected_repository": os.environ["EXPECTED_REPOSITORY"],
              "external_inputs": "outside_repository",
              "kind": "symforge.refreeze_approval_verification_result.v11",
              "record_sha256": current_record_sha256,
              "release_commit": release_commit,
              "release_identity_sha256": sha256_bytes(
                  os.environ["EXPECTED_RELEASE_IDENTITY"].encode("utf-8")
              ),
              "release_tree": release_tree,
              "runner_kind": "github_actions_protected_environment",
              "runner_repository": os.environ["EXPECTED_REPOSITORY"],
              "schema_version": 1,
              "signature_sha256": current_signature_sha256,
              "status": "passed",
              "stderr_sha256": sha256_bytes(read("verify-approval.stderr")),
              "stdout_sha256": sha256_bytes(read("verify-approval.stdout")),
              "verifier_sha256": sha256_bytes(approved_verifier),
              "workflow_commit": os.environ["WORKFLOW_COMMIT"],
              "workflow_event": os.environ["WORKFLOW_EVENT"],
              "workflow_job": os.environ["WORKFLOW_JOB"],
              "workflow_path": ".github/workflows/release.yml",
              "workflow_run_attempt": int(os.environ["WORKFLOW_RUN_ATTEMPT"]),
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "workflow_sha256": sha256_bytes(release_workflow),
          }
          payload = canonical_json(result) + b"\n"
          temporary = result_path.with_name(result_path.name + ".tmp")
          if temporary.exists() or temporary.is_symlink():
              fail("the approval-result temporary path already exists")
          with temporary.open("xb") as handle:
              handle.write(payload)
              handle.flush()
              os.fsync(handle.fileno())
          os.replace(temporary, result_path)
          result_hash_path = material / "approval-result-sha256"
          if result_hash_path.exists() or result_hash_path.is_symlink():
              fail("the approval-result hash path already exists")
          result_hash_path.write_text(sha256_bytes(payload) + "\n", encoding="ascii")
          PY

          APPROVAL_RESULT_SHA256="$(<"$MATERIAL_DIR/approval-result-sha256")"
          cleanup_material
          trap - EXIT

          echo "release_ref=$GATED_RELEASE_REF" >> "$GITHUB_OUTPUT"
          echo "approved_refreeze_commit=$APPROVED_TARGET" >> "$GITHUB_OUTPUT"
          echo "approved_refreeze_tree=$APPROVED_TREE" >> "$GITHUB_OUTPUT"
          echo "approval_result_sha256=$APPROVAL_RESULT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Finalize closed T089 evidence inside the frozen workflow
        shell: bash
        env:
          APPROVAL_RESULT_SHA256: ${{ steps.gate.outputs.approval_result_sha256 }}
          APPROVED_TARGET: ${{ steps.gate.outputs.approved_refreeze_commit }}
          APPROVED_TREE: ${{ steps.gate.outputs.approved_refreeze_tree }}
          BASH_ENV: ''
          ENV: ''
          GATED_RELEASE_REF: ${{ steps.gate.outputs.release_ref }}
          PATH: ${{ steps.trusted-tools.outputs.safe_path }}
          PYTHONHOME: ''
          PYTHONPATH: ''
          TRUSTED_GIT: ${{ steps.trusted-tools.outputs.git }}
          TRUSTED_PYTHON: ${{ steps.trusted-tools.outputs.python }}
        run: |
          set -euo pipefail
          umask 077
          "$TRUSTED_PYTHON" -I - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path, PurePosixPath

          TRACE_PATH = "specs/020-repository-knowledge-index/contracts/lifecycle-oracle-traceability-v11.md"
          ACCEPTANCE_PATH = "specs/020-repository-knowledge-index/contracts/lifecycle-acceptance-oracles-v11.md"
          RETIREMENT_PATH = "specs/020-repository-knowledge-index/contracts/v10-authority-retirement-v11.md"
          TASKS_PATH = "specs/020-repository-knowledge-index/tasks.md"
          CHECKER_PATH = "scripts/validate-lifecycle-oracle-traceability.cjs"
          WORKFLOW_PATH = ".github/workflows/release.yml"
          VERIFIER_PATH = "execution/refreeze_v11.py"
          REQUIREMENTS_PATH = ".github/release-evidence-requirements-v11.json"
          RELEASE_GATE_REVIEW_PATH = "docs/reviews/FEATURE-020-V11-RELEASE-GATE.md"
          APPROVAL_PATH = "target/ci/lifecycle-v11/refreeze-approval-result.json"
          TASK_PATH = "target/ci/lifecycle-v11/task-T089.json"
          EVIDENCE_PATH = "target/ci/lifecycle-v11/release-evidence.json"
          EXPECTED_STDOUT_SHA256 = "0265822a4b6823d04526ef56f82e47f1a0c592c15e234fb0ad3bd812ef377ed5"
          EXPECTED_STDERR_SHA256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          bundle = workspace / "target/ci/lifecycle-v11"
          trusted_git = os.environ["TRUSTED_GIT"]
          expected_approval_sha256 = os.environ["APPROVAL_RESULT_SHA256"]
          expected_release = os.environ["GATED_RELEASE_REF"]
          expected_approved = os.environ["APPROVED_TARGET"]
          expected_approved_tree = os.environ["APPROVED_TREE"]

          def fail(message: str) -> None:
              raise SystemExit(message)

          def sha256_bytes(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()

          def canonical_bytes(value: object) -> bytes:
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")

          def reject_duplicate_pairs(
              pairs: list[tuple[str, object]],
          ) -> dict[str, object]:
              result: dict[str, object] = {}
              for key, value in pairs:
                  if key in result:
                      fail("JSON input contains a duplicate key")
                  result[key] = value
              return result

          def reject_json_constant(_: str) -> object:
              fail("JSON input contains a non-finite number")

          def parse_json_bytes(value: bytes, context: str) -> object:
              try:
                  return json.loads(
                      value.decode("utf-8"),
                      object_pairs_hook=reject_duplicate_pairs,
                      parse_constant=reject_json_constant,
                  )
              except (UnicodeDecodeError, json.JSONDecodeError, TypeError) as error:
                  raise SystemExit(f"{context} is not strict UTF-8 JSON") from error

          def relative_path(value: str) -> PurePosixPath:
              if not isinstance(value, str) or not value or "\\" in value:
                  fail("an evidence path is malformed")
              relative = PurePosixPath(value)
              if relative.is_absolute() or relative.as_posix() != value or any(
                  part in ("", ".", "..") for part in relative.parts
              ):
