<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 232" width="1080" height="232" role="img" aria-labelledby="t d">
  <title id="t">Live Zero-Downtime symforge update Flow</title>
  <desc id="d">Six-step staged upgrade with atomic swap, warm daemon restart, client re-registration, and automatic journal rollback on any failure.</desc>
  <defs>
    <marker id="arrLine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrGood" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrWarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arrBad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="232" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="28" y="34" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">Live Zero-Downtime Upgrade — symforge update</text>
  <text x="1052" y="34" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="end" fill="#15803d">Open stdio MCP sessions never disconnect</text>
  <line x1="24" y1="48" x2="1056" y2="48" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="66" width="156" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="36" y="90" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1. Stage Prefix</text>
  <text x="36" y="112" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#0f172a">npm + native pkg</text>
  <text x="36" y="131" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#475569">beside live dir</text>
  <line x1="182" y1="107" x2="197" y2="107" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrLine)"/>
  <rect x="199" y="66" width="156" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="211" y="90" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">2. Verify Staged</text>
  <text x="211" y="112" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#0f172a">Run staged binary</text>
  <text x="211" y="131" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#475569">--version check</text>
  <line x1="357" y1="107" x2="372" y2="107" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrLine)"/>
  <rect x="374" y="66" width="156" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="386" y="90" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">3. Stop Daemon</text>
  <text x="386" y="112" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#0f172a">Shared daemon only</text>
  <text x="386" y="131" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#475569">stdio stays live</text>
  <line x1="532" y1="107" x2="547" y2="107" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrGood)"/>
  <rect x="549" y="66" width="156" height="82" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.3"/>
  <text x="561" y="90" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#15803d">4. Atomic Swap</text>
  <text x="561" y="112" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#0f172a">Journaled rename</text>
  <text x="561" y="131" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#475569">0 session drops</text>
  <line x1="707" y1="107" x2="722" y2="107" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrGood)"/>
  <rect x="724" y="66" width="156" height="82" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.3"/>
  <text x="736" y="90" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#15803d">5. Warm Restart</text>
  <text x="736" y="112" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#0f172a">Start new daemon</text>
  <text x="736" y="131" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#475569">replay initialize</text>
  <line x1="882" y1="107" x2="897" y2="107" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrGood)"/>
  <rect x="899" y="66" width="156" height="82" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.3"/>
  <text x="911" y="90" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#15803d">6. Re-register</text>
  <text x="911" y="112" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#0f172a">Refresh MCP + skill</text>
  <text x="911" y="131" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#475569">sweep stale bins</text>
  <rect x="260" y="172" width="560" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="540" y="197" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="#b45309">Journal Rollback Safety Rail — any step or verify failure restores previous binary</text>
  <path d="M 627 148 L 627 170" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrWarn)"/>
  <path d="M 802 148 L 802 170" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrWarn)"/>
</svg>
