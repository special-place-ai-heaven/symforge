<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 384" width="1080" height="384" role="img" aria-labelledby="capTitle capDesc">
  <title id="capTitle">SymForge 12.0.0 Core Capabilities</title>
  <desc id="capDesc">Six visual capability cards illustrating Symbol-Level Reading, 1-Turn Pure-Rust Code Mode, Structured Search, Call Graph and Blast Radius, Verified Structural Edits, and Fail-Closed Secret Shielding.</desc>
  <rect x="0" y="0" width="1080" height="384" rx="14" fill="#0c101a" stroke="#294c70" stroke-width="1.5"/>
  <text x="28" y="37" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">What SymForge Gives an Agent — Six Core Primitives in One Rust Engine</text>
  <text x="1052" y="37" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#8b9bb4">63k+ symbols indexed in RAM · ArcSwap lock-free reads</text>
  <line x1="24" y1="50" x2="1056" y2="50" stroke="#294c70" stroke-width="1"/>
  
  <g transform="translate(24, 64)">
    <rect x="0" y="0" width="332" height="142" rx="10" fill="#111927" stroke="#294c70" stroke-width="1.3"/>
    <rect x="16" y="16" width="40" height="40" rx="9" fill="#132f4c"/>
    <g transform="translate(16, 15)"><circle cx="20" cy="14" r="4" fill="none" stroke="#5ab4dd" stroke-width="2"/><circle cx="10" cy="30" r="3.5" fill="none" stroke="#5ab4dd" stroke-width="2"/><circle cx="30" cy="30" r="3.5" fill="none" stroke="#5ab4dd" stroke-width="2"/><path d="M18 17 L12 27 M22 17 L28 27" stroke="#5ab4dd" stroke-width="2" stroke-linecap="round"/></g>
    <rect x="196" y="18" width="120" height="22" rx="11" fill="#132f4c"/>
    <text x="256" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" fill="#5ab4dd">25 LanguageIds</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Symbol-Level Reading</text>
    <text x="16" y="103" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b9bb4">Outlines, imports, consumers &amp; batched</text>
    <text x="16" y="121" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b9bb4">symbol bodies — whole-file reads stay rare.</text>
  </g>
  <g transform="translate(374, 64)">
    <rect x="0" y="0" width="332" height="142" rx="10" fill="#111927" stroke="#294c70" stroke-width="1.3"/>
    <rect x="16" y="16" width="40" height="40" rx="9" fill="#123220"/>
    <g transform="translate(16, 15)"><rect x="7" y="8" width="26" height="26" rx="5" fill="none" stroke="#3fb950" stroke-width="2"/><path d="M22 12 L15 21 H21 L18 30 L25 20 H19 Z" fill="#3fb950"/></g>
    <rect x="196" y="18" width="120" height="22" rx="11" fill="#123220"/>
    <text x="256" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" fill="#3fb950">100% Pure Rust VM</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">1-Turn Code Mode</text>
    <text x="16" y="103" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b9bb4">Embedded Monty bytecode VM chains 15</text>
    <text x="16" y="121" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b9bb4">typed read ops in RAM with zero OS egress.</text>
  </g>
  <g transform="translate(724, 64)">
    <rect x="0" y="0" width="332" height="142" rx="10" fill="#111927" stroke="#294c70" stroke-width="1.3"/>
    <rect x="16" y="16" width="40" height="40" rx="9" fill="#271b3f"/>
    <g transform="translate(16, 15)"><circle cx="18" cy="18" r="8" fill="none" stroke="#a371f7" stroke-width="2"/><line x1="24" y1="24" x2="31" y2="31" stroke="#a371f7" stroke-width="2.4" stroke-linecap="round"/><path d="M16 15 L13 18 L16 21 M20 15 L23 18 L20 21" fill="none" stroke="#a371f7" stroke-width="1.6" stroke-linecap="round"/></g>
    <rect x="196" y="18" width="120" height="22" rx="11" fill="#271b3f"/>
    <text x="256" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" fill="#a371f7">AST + Co-Change</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Structured Search</text>
    <text x="16" y="103" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b9bb4">Literal, regex, concept &amp; ast-grep patterns</text>
    <text x="16" y="121" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b9bb4">grouped by enclosing symbol + frecency.</text>
  </g>
  <g transform="translate(24, 222)">
    <rect x="0" y="0" width="332" height="142" rx="10" fill="#111927" stroke="#294c70" stroke-width="1.3"/>
    <rect x="16" y="16" width="40" height="40" rx="9" fill="#34260d"/>
    <g transform="translate(16, 15)"><circle cx="20" cy="21" r="4" fill="#d29922"/><circle cx="20" cy="21" r="10" fill="none" stroke="#d29922" stroke-width="1.6" stroke-dasharray="3,2"/><circle cx="31" cy="12" r="3" fill="none" stroke="#d29922" stroke-width="1.8"/><line x1="23" y1="18" x2="29" y2="14" stroke="#d29922" stroke-width="1.8"/></g>
    <rect x="196" y="18" width="120" height="22" rx="11" fill="#34260d"/>
    <text x="256" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" fill="#d29922">-76% Caller Chars</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Call Graph &amp; Blast Radius</text>
    <text x="16" y="103" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b9bb4">Direct call sites, trait impls, git symbol</text>
    <text x="16" y="121" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b9bb4">diffs &amp; N-hop impact from changed code.</text>
  </g>
  <g transform="translate(374, 222)">
    <rect x="0" y="0" width="332" height="142" rx="10" fill="#111927" stroke="#294c70" stroke-width="1.3"/>
    <rect x="16" y="16" width="40" height="40" rx="9" fill="#132f4c"/>
    <g transform="translate(16, 15)"><path d="M13 11 L7 21 L13 31 M27 11 L33 21 L27 31" fill="none" stroke="#5ab4dd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 22 L19 25 L25 17" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <rect x="196" y="18" width="120" height="22" rx="11" fill="#132f4c"/>
    <text x="256" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" fill="#5ab4dd">.symforge/tee/ Safe</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Verified Structural Edits</text>
    <text x="16" y="103" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b9bb4">Pre-write backup + tree-sitter check before</text>
    <text x="16" y="121" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b9bb4">atomic write, worktree route &amp; disk re-parse.</text>
  </g>
  <g transform="translate(724, 222)">
    <rect x="0" y="0" width="332" height="142" rx="10" fill="#111927" stroke="#294c70" stroke-width="1.3"/>
    <rect x="16" y="16" width="40" height="40" rx="9" fill="#123220"/>
    <g transform="translate(16, 15)"><path d="M20 8 L31 13 V21 C31 27.5 26 32 20 34 C14 32 9 27.5 9 21 V13 Z" fill="none" stroke="#3fb950" stroke-width="2" stroke-linejoin="round"/><rect x="16" y="19" width="8" height="7" rx="1.5" fill="#3fb950"/><path d="M17.5 19 V16.5 A2.5 2.5 0 0 1 22.5 16.5 V19" fill="none" stroke="#3fb950" stroke-width="1.8"/></g>
    <rect x="196" y="18" width="120" height="22" rx="11" fill="#123220"/>
    <text x="256" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" fill="#3fb950">Fail-Closed Gate</text>
    <text x="16" y="80" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Secret Shield &amp; Knowledge</text>
    <text x="16" y="103" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b9bb4">admit_disk_read withholds secret values;</text>
    <text x="16" y="121" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8b9bb4">docs &amp; specs stay isolated from code hits.</text>
