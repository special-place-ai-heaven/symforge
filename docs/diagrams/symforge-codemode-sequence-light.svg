<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 414" width="1080" height="414" role="img" aria-labelledby="t d">
  <title id="t">Single-Turn Code Mode Execution</title>
  <desc id="d">AI Agent sends one 4-line script to the pure-Rust Monty Bytecode VM, which chains search_symbols, find_references, and get_symbol in Rust RAM and returns one compact JSON answer.</desc>
  <defs>
    <marker id="arrLine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrGood" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrWarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arrBad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="414" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="28" y="34" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">Single-Turn Code Mode Execution — Embedded Pure-Rust Monty VM</text>
  <text x="1052" y="34" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="end" fill="#15803d">1 LLM Turn · Zero Python Runtime</text>
  <line x1="24" y1="48" x2="1056" y2="48" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="35" y="64" width="240" height="52" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="155" y="86" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">AI Agent (LLM)</text>
  <text x="155" y="104" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1d4ed8">1 turn · ~600 B returned</text>
  <rect x="390" y="64" width="290" height="52" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="535" y="86" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#15803d">Monty Bytecode VM</text>
  <text x="535" y="104" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0f172a">100% Rust · NoOs · Zero Egress</text>
  <rect x="760" y="64" width="290" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="905" y="86" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">LiveIndex + admit_disk_read</text>
  <text x="905" y="104" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle" fill="#475569">In-Memory AST &amp; Secret Shield</text>
  <line x1="155" y1="116" x2="155" y2="394" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="535" y1="116" x2="535" y2="394" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="905" y1="116" x2="905" y2="394" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="345" y="140" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1d4ed8">code_execute / symforge code run (4-line script)</text>
  <line x1="161" y1="148" x2="529" y2="148" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="720" y="174" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0f172a">1. search_symbols(query="enforce_compact_surface", kind="fn")</text>
  <line x1="541" y1="182" x2="899" y2="182" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrLine)"/>
  <text x="720" y="206" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">symbol span + path (stays in Rust RAM)</text>
  <line x1="899" y1="214" x2="541" y2="214" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrLine)"/>
  <text x="720" y="244" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0f172a">2. find_references(name=..., kind="call")</text>
  <line x1="541" y1="252" x2="899" y2="252" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrLine)"/>
  <text x="720" y="276" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">40 call sites -&gt; filtered to top 3 inside VM (stays in Rust RAM)</text>
  <line x1="899" y1="284" x2="541" y2="284" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrLine)"/>
  <text x="720" y="314" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0f172a">3. get_symbol(targets=top_3) via admit_disk_read</text>
  <line x1="541" y1="322" x2="899" y2="322" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrGood)"/>
  <text x="720" y="346" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#15803d">permitted symbol bodies (secret-bearing files withheld)</text>
  <line x1="899" y1="354" x2="541" y2="354" stroke="#15803d" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrGood)"/>
  <rect x="205" y="364" width="280" height="24" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="345" y="380" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#15803d">✓ 1 compact JSON (~600 B, 1 LLM turn)</text>
  <line x1="529" y1="390" x2="161" y2="390" stroke="#15803d" stroke-width="2.0" marker-end="url(#arrGood)"/>
</svg>
