<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" width="1080" height="680" role="img" aria-labelledby="vTitle vDesc">
  <title id="vTitle">SymForge 12.0.0 Measured Context &amp; Token Savings on Large Codebases</title>
  <desc id="vDesc">Measured v12.0.0 byte and token comparison on the SymForge repository (1,736 files, 63,824 symbols): reading one function drops from 238,754 B to 2,259 B (-99.1%), subsystem orientation drops from 157,977 B to 545 B (-99.7%), caller tracing drops from 311,618 B (or 21,772 B windowed) to 489-9,706 B in 1 turn, and Code Mode cuts session entry + query tokens by 94% to 98%.</desc>
  <rect x="0" y="0" width="1080" height="680" rx="14" fill="#0c101a" stroke="#263850" stroke-width="1.5"/>

  <text x="28" y="34" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17.5" font-weight="700" fill="#e6edf3">Why SymForge &amp; V12 Code Mode Save Context on Large Files (Measured on v12.0.0)</text>
  <text x="1052" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8b9bb4">Repo: symforge (1,736 files · 63,824 symbols)</text>

