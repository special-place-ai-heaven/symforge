<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 310" width="1080" height="310" role="img" aria-labelledby="t d">
  <title id="t">SymForge Three Serving Topologies</title>
  <desc id="d">Comparison of Shared Loopback Daemon (default stdio), Local In-Process (SYMFORGE_NO_DAEMON=1), and Multi-Repo Streamable HTTP (symforge serve).</desc>
  <defs>
    <marker id="arrLine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrGood" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrWarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arrBad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="310" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="28" y="34" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">Three Local-First Serving Topologies — Nothing Leaves the Machine</text>
  <line x1="24" y1="48" x2="1056" y2="48" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="62" width="1032" height="68" rx="10" fill="#f1f5f9" stroke="#22c55e" stroke-width="1.3"/>
  <text x="40" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#15803d">1. Shared Loopback Daemon (Default stdio)</text>
  <rect x="40" y="92" width="224" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="152" y="110" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">Claude + Codex + CLI</text>
  <line x1="266" y1="106" x2="292" y2="106" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrGood)"/>
  <rect x="294" y="92" width="224" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="406" y="110" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">stdio proxy / CLI</text>
  <line x1="520" y1="106" x2="546" y2="106" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrGood)"/>
  <rect x="548" y="92" width="224" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="110" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">1 Loopback Daemon (Bearer)</text>
  <line x1="774" y1="106" x2="800" y2="106" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrGood)"/>
  <rect x="802" y="92" width="224" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="914" y="110" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">Shared Warm LiveIndex</text>
  <rect x="24" y="144" width="1032" height="68" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="40" y="166" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">2. Local In-Process (SYMFORGE_NO_DAEMON=1)</text>
  <rect x="40" y="174" width="224" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="152" y="192" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">Single MCP Client</text>
  <line x1="266" y1="188" x2="292" y2="188" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <rect x="294" y="174" width="224" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="406" y="192" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">stdio Server Process</text>
  <line x1="520" y1="188" x2="546" y2="188" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <rect x="548" y="174" width="224" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="192" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">Embedded LiveIndex in RAM</text>
  <line x1="774" y1="188" x2="800" y2="188" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <rect x="802" y="174" width="224" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="914" y="192" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">Zero Daemon Socket</text>
  <rect x="24" y="226" width="1032" height="68" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="40" y="248" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">3. Multi-Repo Streamable HTTP (symforge serve)</text>
  <rect x="40" y="256" width="224" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="152" y="274" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">HTTP Clients + /admin</text>
  <line x1="266" y1="270" x2="292" y2="270" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <rect x="294" y="256" width="224" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="406" y="274" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">symforge serve (:8787)</text>
  <line x1="520" y1="270" x2="546" y2="270" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <rect x="548" y="256" width="224" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="274" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">--project repoA</text>
  <line x1="774" y1="270" x2="800" y2="270" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <rect x="802" y="256" width="224" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="914" y="274" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">--project repoB</text>
</svg>
