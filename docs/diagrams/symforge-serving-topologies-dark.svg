<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 310" width="1080" height="310" role="img" aria-labelledby="t d">
  <title id="t">SymForge Three Serving Topologies</title>
  <desc id="d">Comparison of Shared Loopback Daemon (default stdio), Local In-Process (SYMFORGE_NO_DAEMON=1), and Multi-Repo Streamable HTTP (symforge serve).</desc>
  <defs>
    <marker id="arrLine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4a6282"/>
    </marker>
    <marker id="arrGood" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrWarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f0883e"/>
    </marker>
    <marker id="arrBad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="310" rx="14" fill="#0c101a" stroke="#263850" stroke-width="1.5"/>
  <text x="28" y="34" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16.5" font-weight="700" fill="#e6edf3">Three Local-First Serving Topologies — Nothing Leaves the Machine</text>
  <line x1="24" y1="48" x2="1056" y2="48" stroke="#263850" stroke-width="1"/>
  <rect x="24" y="62" width="1032" height="68" rx="10" fill="#0d1522" stroke="#2ea043" stroke-width="1.3"/>
  <text x="40" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#3fb950">1. Shared Loopback Daemon (Default stdio)</text>
  <rect x="40" y="92" width="224" height="28" rx="6" fill="#111927" stroke="#263850" stroke-width="1"/>
  <text x="152" y="110" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">Claude + Codex + CLI</text>
  <line x1="266" y1="106" x2="292" y2="106" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrGood)"/>
  <rect x="294" y="92" width="224" height="28" rx="6" fill="#111927" stroke="#263850" stroke-width="1"/>
  <text x="406" y="110" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">stdio proxy / CLI</text>
  <line x1="520" y1="106" x2="546" y2="106" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrGood)"/>
  <rect x="548" y="92" width="224" height="28" rx="6" fill="#111927" stroke="#263850" stroke-width="1"/>
  <text x="660" y="110" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">1 Loopback Daemon (Bearer)</text>
  <line x1="774" y1="106" x2="800" y2="106" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrGood)"/>
  <rect x="802" y="92" width="224" height="28" rx="6" fill="#111927" stroke="#263850" stroke-width="1"/>
  <text x="914" y="110" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">Shared Warm LiveIndex</text>
  <rect x="24" y="144" width="1032" height="68" rx="10" fill="#0d1522" stroke="#263850" stroke-width="1.3"/>
  <text x="40" y="166" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#58a6ff">2. Local In-Process (SYMFORGE_NO_DAEMON=1)</text>
  <rect x="40" y="174" width="224" height="28" rx="6" fill="#111927" stroke="#263850" stroke-width="1"/>
  <text x="152" y="192" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">Single MCP Client</text>
  <line x1="266" y1="188" x2="292" y2="188" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <rect x="294" y="174" width="224" height="28" rx="6" fill="#111927" stroke="#263850" stroke-width="1"/>
  <text x="406" y="192" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">stdio Server Process</text>
  <line x1="520" y1="188" x2="546" y2="188" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <rect x="548" y="174" width="224" height="28" rx="6" fill="#111927" stroke="#263850" stroke-width="1"/>
  <text x="660" y="192" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">Embedded LiveIndex in RAM</text>
  <line x1="774" y1="188" x2="800" y2="188" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <rect x="802" y="174" width="224" height="28" rx="6" fill="#111927" stroke="#263850" stroke-width="1"/>
  <text x="914" y="192" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">Zero Daemon Socket</text>
  <rect x="24" y="226" width="1032" height="68" rx="10" fill="#0d1522" stroke="#263850" stroke-width="1.3"/>
  <text x="40" y="248" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#58a6ff">3. Multi-Repo Streamable HTTP (symforge serve)</text>
  <rect x="40" y="256" width="224" height="28" rx="6" fill="#111927" stroke="#263850" stroke-width="1"/>
  <text x="152" y="274" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">HTTP Clients + /admin</text>
  <line x1="266" y1="270" x2="292" y2="270" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <rect x="294" y="256" width="224" height="28" rx="6" fill="#111927" stroke="#263850" stroke-width="1"/>
  <text x="406" y="274" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">symforge serve (:8787)</text>
  <line x1="520" y1="270" x2="546" y2="270" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <rect x="548" y="256" width="224" height="28" rx="6" fill="#111927" stroke="#263850" stroke-width="1"/>
  <text x="660" y="274" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">--project repoA</text>
  <line x1="774" y1="270" x2="800" y2="270" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <rect x="802" y="256" width="224" height="28" rx="6" fill="#111927" stroke="#263850" stroke-width="1"/>
  <text x="914" y="274" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">--project repoB</text>
</svg>
