  <text x="860" y="103" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#0f172a">0 B (0 tok)</text>
  <rect x="878" y="90" width="160" height="28" rx="14" fill="#e2e8f0"/>
  <text x="958" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#16a34a">-100%</text>
