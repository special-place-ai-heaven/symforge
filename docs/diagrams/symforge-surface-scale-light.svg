<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 412" width="1080" height="412" role="img" aria-labelledby="sTitle sDesc">
  <title id="sTitle">SymForge 12.0.0 Upfront Schema Cost by Surface Profile</title>
  <desc id="sDesc">Proportional bar chart comparing upfront tools/list byte and token cost across CLI skill-only (0 B), code surface (3,980 B, -94.0%), compact surface (4,552 B, -93.1%), core surface (28,162 B, -57.4%), and default full surface (66,181 B).</desc>
  <rect x="0" y="0" width="1080" height="412" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="36" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Upfront Context Cost per Session (Measured `tools/list` Payload in v12.0.0)</text>
  <text x="1040" y="36" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#475569">43 registered · pick the smallest surface that fits</text>
  <line x1="24" y1="54" x2="1056" y2="54" stroke="#cbd5e1" stroke-width="1"/>
  
  <rect x="24" y="78" width="1032" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="101" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a">CLI + SKILL.md</text>
  <text x="40" y="119" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#475569">--code-skill --skill-only</text>

