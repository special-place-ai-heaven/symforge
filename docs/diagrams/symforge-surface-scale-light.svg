  <rect x="878" y="346" width="160" height="28" rx="14" fill="#e2e8f0"/>
  <text x="958" y="364" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#64748b">baseline</text>
