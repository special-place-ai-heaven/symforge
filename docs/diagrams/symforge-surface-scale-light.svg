  <rect x="255" y="154" width="26" height="14" rx="7" fill="#0284c7"/>
  <text x="255" y="185" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">4 tools: code_search · code_execute · symforge_edit · status</text>

  <text x="860" y="167" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#0f172a">3,980 B (~995 tok)</text>
  <rect x="878" y="154" width="160" height="28" rx="14" fill="#e2e8f0"/>
