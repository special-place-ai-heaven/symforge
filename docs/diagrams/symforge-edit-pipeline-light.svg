<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 292" width="1080" height="292" role="img" aria-labelledby="t d">
  <title id="t">Structural Edit Safety Pipeline and Worktree Routing</title>
  <desc id="d">Every edit resolves AST byte spans, runs admit_disk_read, writes a .symforge/tee/ backup, validates tree-sitter syntax, and writes atomically to either the primary workspace or a sibling git worktree.</desc>
  <defs>
    <marker id="arrLine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrGood" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrWarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arrBad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="292" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="28" y="34" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">Structural Edit Safety Pipeline &amp; Sibling Git Worktree Routing</text>
  <line x1="24" y1="48" x2="1056" y2="48" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="122" width="120" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="34" y="145" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">1. AST Span</text>
  <text x="34" y="164" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">Resolve exact</text>
  <text x="34" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">symbol bytes</text>
  <line x1="144" y1="160" x2="158" y2="160" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrLine)"/>
  <rect x="160" y="122" width="126" height="76" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="170" y="145" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">2. Read Gate</text>
  <text x="170" y="164" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#0f172a">admit_disk_read</text>
  <text x="170" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">drift + secrets</text>
  <line x1="286" y1="160" x2="300" y2="160" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrLine)"/>
  <rect x="302" y="122" width="120" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="312" y="145" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">3. Tee Backup</text>
  <text x="312" y="164" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">Save pre-write</text>
  <text x="312" y="180" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#475569">.symforge/tee/</text>
  <line x1="422" y1="160" x2="436" y2="160" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrLine)"/>
  <rect x="438" y="122" width="124" height="76" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
  <text x="448" y="145" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#15803d">4. Syntax Gate</text>
  <text x="448" y="164" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#0f172a">tree-sitter AST</text>
  <text x="448" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">parse verified</text>
  <path d="M 562 145 L 592 145 L 592 106 L 618 106" fill="none" stroke="#15803d" stroke-width="1.7" marker-end="url(#arrGood)"/>
  <path d="M 562 175 L 592 175 L 592 222 L 618 222" fill="none" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arrBlue)"/>
  <rect x="620" y="66" width="436" height="82" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
  <text x="636" y="89" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#15803d">Default (primary workspace)</text>
  <text x="636" y="111" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#0f172a">5a. Atomic write  -&gt;  6a. Re-parse landed disk bytes</text>
  <text x="636" y="131" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">7a. Publish new LiveIndex ArcSwap generation + edit receipt</text>
  <rect x="620" y="180" width="436" height="92" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="636" y="203" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#1d4ed8">working_directory supplied (e.g. "../feature-wt")</text>
  <text x="636" y="225" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#0f172a">5b. Validate sibling git worktree + SYMFORGE_WORKTREE_AWARE</text>
  <text x="636" y="245" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">6b. Rebase-splice &amp; atomic write inside worktree</text>
  <text x="636" y="262" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" fill="#1d4ed8">7b. Primary LiveIndex stays clean · receipt: wrote_to + rerouted: true</text>
</svg>
