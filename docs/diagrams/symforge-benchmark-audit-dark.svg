<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 530" width="1080" height="530" role="img" aria-labelledby="bTitle bDesc">
  <title id="bTitle">SymForge Measured Benchmark Breakdown (2026-11-09 Audit, 36 Paired Runs)</title>
  <desc id="bDesc">Paired horizontal bar chart from the 2026-11-09 Product Audit showing retrieved characters and tool calls on Sonnet across 6 tasks: large savings on caller tracing (-76%), symbol lookup (-51%), and function understanding (-39%), alongside honest overhead on nearby single-file reads (+32%, +57%) and literal string counting (+535%), plus V12 Code Mode summary metrics.</desc>
  <rect x="0" y="0" width="1080" height="530" rx="14" fill="#0c101a" stroke="#294c70" stroke-width="1.5"/>

  <text x="32" y="34" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Measured Retrieval Breakdown — Where SymForge Wins &amp; Where rg / Read Wins</text>
  <text x="1048" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8b9bb4">Source: 2026-11-09 Audit (36 paired runs)</text>

