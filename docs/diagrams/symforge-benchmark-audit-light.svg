<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 584" width="1080" height="584" role="img" aria-labelledby="bTitle bDesc">
  <title id="bTitle">SymForge Measured Benchmark Breakdown (2026-11-09 Audit, 36 Paired Runs on v11.11.0)</title>
  <desc id="bDesc">Color-coded benchmark chart: overall green win banner (-32% total retrieved chars across 36 runs; -8% Sonnet, -52% Haiku), green bars where SymForge saves big on caller tracing (-12,664 ch / -76%), understanding (-8,559 ch / -39%), and lookup (-2,162 ch / -51%), orange warnings for multi-region single-file reads, and red for forcing literal string counting through AST search instead of rg -c.</desc>
  <rect x="0" y="0" width="1080" height="584" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="28" y="34" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Measured Benchmark Breakdown (36 Paired Runs on v11.11.0 — Lower Chars Is Better)</text>

  <!-- OVERALL VERDICT BANNER (GREEN = NET WIN ACROSS ALL 36 RUNS!) -->
  <rect x="24" y="48" width="1032" height="50" rx="9" fill="#dcfce7" stroke="#2ea043" stroke-width="1.4"/>
  <text x="42" y="70" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700" fill="#2ea043">✓ OVERALL NET RESULT (ALL 36 RUNS): -32% FEWER RETRIEVED CHARS WITH SYMFORGE</text>
  <text x="42" y="88" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#0f172a">Sonnet total: 134,448 → 123,648 ch (-8% chars, -12% cost)  ·  Haiku total: 155,761 → 74,376 ch (-52% chars, -2% cost)</text>

