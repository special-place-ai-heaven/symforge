<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 334" width="1080" height="334" role="img" aria-labelledby="t d">
  <title id="t">Preventive Index Lifecycle and Secret Admission Gate</title>
  <desc id="d">Startup validates .symforge/index.bin format-11 SHA-256 and dismissal digests or quarantines before cold rebuild; admit_disk_read withholds secret-bearing file bytes as MetadataOnly.</desc>
  <defs>
    <marker id="arrLine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrGood" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrWarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arrBad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="334" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="28" y="34" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">Preventive Index Lifecycle (Format-11) &amp; Secret Admission Gate</text>
  <line x1="24" y1="48" x2="1056" y2="48" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="62" width="566" height="254" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="86" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Startup &amp; Format-11 Snapshot Publication</text>
  <rect x="40" y="104" width="210" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="52" y="127" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#0f172a">.symforge/index.bin</text>
  <text x="52" y="147" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">Format-11 + SHA-256 + digest?</text>
  <path d="M 250 120 L 284 120" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrGood)"/>
  <path d="M 145 162 L 145 218 L 284 218" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrWarn)"/>
  <rect x="286" y="98" width="286" height="76" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.3"/>
  <text x="300" y="119" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#15803d">✓ Valid Format-11 Snapshot</text>
  <text x="300" y="138" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">Restore immediately (SnapshotRestore)</text>
  <text x="300" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">Background reconcile vs disk -&gt; Ready</text>
  <rect x="286" y="190" width="286" height="78" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="300" y="211" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">⚠ Older Seed (&lt; v11) or Corrupt</text>
  <text x="300" y="230" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" fill="#0f172a">Preserve in .symforge/quarantine/</text>
  <text x="300" y="248" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">Cold tree-sitter rebuild -&gt; ArcSwap Ready</text>
  <text x="40" y="296" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">Incomplete candidates never publish as current; unverified state is declared.</text>
  <rect x="610" y="62" width="446" height="254" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="626" y="86" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Secret Admission Gate (admit_disk_read)</text>
  <rect x="626" y="104" width="414" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="640" y="131" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Every disk read -&gt; classify exact buffer before serving</text>
  <line x1="730" y1="148" x2="730" y2="174" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrGood)"/>
  <line x1="935" y1="148" x2="935" y2="174" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arrBad)"/>
  <rect x="626" y="176" width="200" height="120" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.3"/>
  <text x="638" y="199" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#15803d">✓ Clean / Identifier</text>
  <text x="638" y="220" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">No secret literal value</text>
  <text x="638" y="240" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">Serve exact source</text>
  <text x="638" y="258" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">&amp; AST symbol spans</text>
  <rect x="840" y="176" width="200" height="120" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.3"/>
  <text x="852" y="199" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c">✕ Secret Value Found</text>
  <text x="852" y="220" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">Withhold file bytes</text>
  <text x="852" y="240" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" fill="#b91c1c">(MetadataOnly)</text>
  <text x="852" y="258" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">Rule + lines in _meta</text>
  <text x="852" y="276" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#15803d">Zero secret egress</text>
</svg>
