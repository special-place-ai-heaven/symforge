<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Raw File Haystack vs. SymForge Surgical Symbol Intelligence</title>
  <desc id="desc">Visual comparison showing raw whole-file reads, noisy grep matches, leaked secrets, and blind string edits on the left versus SymForge AST symbol slicing, pure-Rust Monty VM single-turn chaining, admit_disk_read secret shielding, and tree-sitter validated structural edits on the right.</desc>

  <defs>
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0e4da5" stop-opacity="0.06"/>
    </linearGradient>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1080" height="470" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="540" y="34" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f172a">How Coding Agents See Your Repository: Raw Text Haystack vs. SymForge AST Precision</text>

  <!-- ================= LEFT PANEL: WITHOUT SYMFORGE ================= -->
  <rect x="22" y="52" width="496" height="396" rx="12" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5"/>
  <rect x="38" y="66" width="218" height="24" rx="12" fill="#fee2e2"/>
  <text x="147" y="83" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#dc2626">WITHOUT SYMFORGE</text>
  <text x="502" y="83" text-anchor="end" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#475569">5+ LLM turns · tens of KB dumped</text>

  <!-- Bloated Whole File Graphic -->
  <rect x="40" y="104" width="192" height="266" rx="8" fill="#f1f5f9" stroke="#feb2b2" stroke-width="1.2"/>
  <text x="52" y="124" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#475569">src/daemon.rs (2,400 lines)</text>
  <line x1="40" y1="133" x2="232" y2="133" stroke="#feb2b2" stroke-width="1"/>
  <!-- Noisy grey lines + red false-positive grep lines -->
  <rect x="52" y="145" width="130" height="6" rx="3" fill="#475569" opacity="0.28"/>
  <rect x="52" y="158" width="156" height="6" rx="3" fill="#dc2626" opacity="0.55"/>
  <text x="52" y="177" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#dc2626">// comment hit (noise)</text>
  <rect x="52" y="186" width="144" height="6" rx="3" fill="#475569" opacity="0.28"/>
  <rect x="52" y="199" width="112" height="6" rx="3" fill="#475569" opacity="0.28"/>
  <rect x="52" y="212" width="164" height="6" rx="3" fill="#dc2626" opacity="0.55"/>
  <text x="52" y="231" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#dc2626">"string literal" (noise)</text>
  <rect x="52" y="241" width="150" height="18" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="60" y="254" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#0284c7">fn target() &#123; 18 lines &#125;</text>
  <rect x="52" y="268" width="138" height="6" rx="3" fill="#475569" opacity="0.28"/>
  <rect x="52" y="281" width="162" height="6" rx="3" fill="#475569" opacity="0.28"/>
  <rect x="52" y="294" width="120" height="6" rx="3" fill="#475569" opacity="0.28"/>
  <!-- Secret file accidentally read -->
  <rect x="50" y="314" width="172" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="60" y="332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700" fill="#dc2626">! .env.local read raw</text>
  <text x="60" y="348" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#0f172a">Secret token enters prompt</text>

  <!-- Ping-pong arrows to Context Window -->
  <line x1="238" y1="158" x2="296" y2="158" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <line x1="296" y1="178" x2="238" y2="178" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <line x1="238" y1="215" x2="296" y2="215" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <line x1="296" y1="235" x2="238" y2="235" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <line x1="238" y1="272" x2="296" y2="272" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="267" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="700" fill="#dc2626">5 turns</text>

  <!-- Right side of Left Panel: Stuffed Context + Fragile Edit -->
  <rect x="304" y="104" width="196" height="176" rx="8" fill="#ffffff" stroke="#feb2b2" stroke-width="1.2"/>
  <text x="402" y="126" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Stuffed Context Window</text>
  <rect x="318" y="138" width="168" height="20" rx="4" fill="#fee2e2"/>
  <text x="402" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#dc2626">94% irrelevant lines</text>
  <text x="318" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">• Grep matches comments/strings</text>
  <text x="318" y="198" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">• No caller or type provenance</text>
  <text x="318" y="218" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">• Every lookup costs 1 turn</text>
  <text x="318" y="238" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">• Prompt cache churns fast</text>

  <rect x="304" y="294" width="196" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="402" y="316" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#dc2626">Blind String-Replace Edit</text>
  <text x="402" y="336" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#0f172a">Whitespace drift or duplicate</text>
  <text x="402" y="353" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#0f172a">block corrupts syntax on disk</text>

  <text x="270" y="428" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600" fill="#dc2626">Result: high token burn · slow multi-turn search · unverified edits</text>

  <!-- ================= RIGHT PANEL: WITH SYMFORGE 12.0 ================= -->
  <rect x="540" y="52" width="518" height="396" rx="12" fill="#f0f7ff" stroke="#3182ce" stroke-width="1.8"/>
  <rect x="540" y="52" width="518" height="396" rx="12" fill="url(#forgeGrad)"/>
  <rect x="556" y="66" width="244" height="24" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="678" y="83" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#0284c7">WITH SYMFORGE 12.0 (100% RUST)</text>
  <text x="1040" y="83" text-anchor="end" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#16a34a">1 turn · ~600 B exact answer</text>

  <!-- LiveIndex + AST Slice + Secret Gate -->
  <rect x="558" y="104" width="214" height="196" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="570" y="125" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#0284c7">LiveIndex (ArcSwap RAM)</text>
  <text x="570" y="142" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">19 tree-sitter ASTs + Format-11 SHA256</text>
  <line x1="558" y1="150" x2="772" y2="150" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Surgical AST nodes -->
  <rect x="570" y="160" width="190" height="28" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="580" y="178" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700" fill="#0284c7">fn target() [L241-259]</text>

  <rect x="584" y="196" width="176" height="24" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="594" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#0f172a">↳ 3 verified AST call sites</text>

  <rect x="584" y="226" width="176" height="24" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="594" y="242" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#0f172a">↳ docs isolated in knowledge</text>

  <rect x="570" y="258" width="190" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="580" y="273" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" fill="#16a34a">admit_disk_read Gate</text>
  <text x="580" y="285" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" fill="#0f172a">.env withheld (rule + line only)</text>

  <!-- Monty VM middle bridge -->
  <line x1="774" y1="184" x2="824" y2="184" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="799" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="700" fill="#0284c7">1 turn</text>

  <!-- Right side of Right Panel: Monty VM + Structural Edit -->
  <rect x="828" y="104" width="212" height="196" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="934" y="125" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#0284c7">Monty VM (Pure Rust)</text>
  <text x="934" y="142" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#475569">No Python runtime · Zero OS egress</text>
  <line x1="828" y1="150" x2="1040" y2="150" stroke="#cbd5e1" stroke-width="1"/>
  <text x="840" y="170" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#0f172a">1. search_symbols()</text>
  <text x="840" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#0f172a">2. find_references()</text>
  <text x="840" y="206" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#0f172a">3. get_symbol(top_3)</text>
  <rect x="840" y="220" width="188" height="24" rx="4" fill="#dcfce7"/>
  <text x="934" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" fill="#16a34a">Schema: 3,980 B (-94.0%)</text>
  <rect x="840" y="252" width="188" height="36" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="934" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600" fill="#d97706">STEL Trust Envelope</text>
  <text x="934" y="282" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" fill="#475569">exact · complete · file:line</text>

  <!-- Bottom Wide Bar: Verified Structural Edit -->
  <rect x="558" y="312" width="482" height="86" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
  <text x="574" y="333" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#16a34a">AST-Validated Structural Edit &amp; Worktree Isolation</text>
  <rect x="574" y="345" width="98" height="38" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="623" y="362" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600" fill="#0f172a">.symforge/tee/</text>
  <text x="623" y="375" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#475569">pre-write backup</text>
  <line x1="674" y1="364" x2="694" y2="364" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

  <rect x="698" y="345" width="104" height="38" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="750" y="362" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600" fill="#0f172a">tree-sitter</text>
  <text x="750" y="375" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#475569">syntax verified</text>
  <line x1="804" y1="364" x2="824" y2="364" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

  <rect x="828" y="345" width="96" height="38" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="876" y="362" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600" fill="#0f172a">Atomic Write</text>
  <text x="876" y="375" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#475569">or git worktree</text>
  <line x1="926" y1="364" x2="946" y2="364" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

  <rect x="950" y="345" width="76" height="38" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="988" y="362" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="700" fill="#16a34a">Disk Re-parse</text>
  <text x="988" y="375" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#0f172a">ArcSwap live</text>

  <text x="799" y="428" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0284c7">Result: -94% schema overhead · lock-free RAM reads · byte-exact edits</text>
</svg>
