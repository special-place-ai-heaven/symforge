  <text x="1052" y="37" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600" fill="#2ea043">✓ 63k+ symbols in RAM · Lock-free ArcSwap</text>
