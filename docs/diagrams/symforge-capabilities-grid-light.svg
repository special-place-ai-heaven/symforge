  <title id="capTitle">SymForge 12.0.0 Core Capabilities</title>
  <desc id="capDesc">Six visual capability cards with green outcome badges illustrating Symbol-Level Reading, 1-Turn Pure-Rust Code Mode, Structured AST Search, Call Graph and Blast Radius, Safe Structural Edits, and Secret Shielding.</desc>
