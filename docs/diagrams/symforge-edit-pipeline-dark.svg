<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 292" width="1080" height="292" role="img" aria-labelledby="t d">
  <title id="t">Structural Edit Safety Pipeline and Worktree Routing</title>
  <desc id="d">Every edit resolves AST byte spans, runs admit_disk_read, writes a .symforge/tee/ backup, validates tree-sitter syntax, and writes atomically to either the primary workspace or a sibling git worktree.</desc>
  <defs>
    <marker id="arrLine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4a6282"/>
    </marker>
    <marker id="arrGood" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrWarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f0883e"/>
    </marker>
    <marker id="arrBad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="292" rx="14" fill="#0c101a" stroke="#263850" stroke-width="1.5"/>
  <text x="28" y="34" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16.5" font-weight="700" fill="#e6edf3">Structural Edit Safety Pipeline &amp; Sibling Git Worktree Routing</text>
  <line x1="24" y1="48" x2="1056" y2="48" stroke="#263850" stroke-width="1"/>
  <rect x="24" y="122" width="120" height="76" rx="8" fill="#111927" stroke="#263850" stroke-width="1.2"/>
  <text x="34" y="145" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#e6edf3">1. AST Span</text>
  <text x="34" y="164" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#8b9bb4">Resolve exact</text>
  <text x="34" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#8b9bb4">symbol bytes</text>
  <line x1="144" y1="160" x2="158" y2="160" stroke="#4a6282" stroke-width="1.6" marker-end="url(#arrLine)"/>
  <rect x="160" y="122" width="126" height="76" rx="8" fill="#111927" stroke="#d29922" stroke-width="1.2"/>
  <text x="170" y="145" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#f0883e">2. Read Gate</text>
  <text x="170" y="164" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#e6edf3">admit_disk_read</text>
  <text x="170" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#8b9bb4">drift + secrets</text>
  <line x1="286" y1="160" x2="300" y2="160" stroke="#4a6282" stroke-width="1.6" marker-end="url(#arrLine)"/>
  <rect x="302" y="122" width="120" height="76" rx="8" fill="#111927" stroke="#263850" stroke-width="1.2"/>
  <text x="312" y="145" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#e6edf3">3. Tee Backup</text>
  <text x="312" y="164" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#8b9bb4">Save pre-write</text>
  <text x="312" y="180" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#8b9bb4">.symforge/tee/</text>
  <line x1="422" y1="160" x2="436" y2="160" stroke="#4a6282" stroke-width="1.6" marker-end="url(#arrLine)"/>
  <rect x="438" y="122" width="124" height="76" rx="8" fill="#0d2818" stroke="#2ea043" stroke-width="1.2"/>
  <text x="448" y="145" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#3fb950">4. Syntax Gate</text>
  <text x="448" y="164" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#e6edf3">tree-sitter AST</text>
  <text x="448" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#8b9bb4">parse verified</text>
  <path d="M 562 145 L 592 145 L 592 106 L 618 106" fill="none" stroke="#3fb950" stroke-width="1.7" marker-end="url(#arrGood)"/>
  <path d="M 562 175 L 592 175 L 592 222 L 618 222" fill="none" stroke="#58a6ff" stroke-width="1.7" marker-end="url(#arrBlue)"/>
  <rect x="620" y="66" width="436" height="82" rx="10" fill="#0d2818" stroke="#2ea043" stroke-width="1.4"/>
  <text x="636" y="89" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3fb950">Default (primary workspace)</text>
  <text x="636" y="111" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#e6edf3">5a. Atomic write  -&gt;  6a. Re-parse landed disk bytes</text>
  <text x="636" y="131" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#8b9bb4">7a. Publish new LiveIndex ArcSwap generation + edit receipt</text>
  <rect x="620" y="180" width="436" height="92" rx="10" fill="#0f223d" stroke="#388bfd" stroke-width="1.4"/>
  <text x="636" y="203" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#58a6ff">working_directory supplied (e.g. "../feature-wt")</text>
  <text x="636" y="225" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#e6edf3">5b. Validate sibling git worktree + SYMFORGE_WORKTREE_AWARE</text>
  <text x="636" y="245" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#8b9bb4">6b. Rebase-splice &amp; atomic write inside worktree</text>
  <text x="636" y="262" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" fill="#58a6ff">7b. Primary LiveIndex stays clean · receipt: wrote_to + rerouted: true</text>
</svg>
