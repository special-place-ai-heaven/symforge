<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 486" width="1080" height="486" role="img" aria-labelledby="title desc">
  <title id="title">Raw File Haystack (Bad) vs. SymForge AST Precision (Good)</title>
  <desc id="desc">Color-coded comparison: red/orange shows bad raw whole-file reads, noisy grep matches, leaked secrets, and blind string edits; green shows good SymForge AST symbol slicing, pure-Rust Monty VM single-turn chaining, admit_disk_read secret shielding, and tree-sitter validated structural edits.</desc>

  <defs>
    <marker id="arrowBad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149"/>
    </marker>
    <marker id="arrowGood" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="486" rx="14" fill="#0c101a" stroke="#263850" stroke-width="1.5"/>

  <!-- Header + Semantic Color Key -->
  <text x="28" y="34" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17.5" font-weight="700" fill="#e6edf3">How Agents Read &amp; Edit Code: Raw Text Haystack vs. SymForge AST Precision</text>
  <circle cx="776" cy="29" r="5" fill="#3fb950"/>
  <text x="787" y="33" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#3fb950">Good (Safe / Efficient)</text>
  <circle cx="928" cy="29" r="5" fill="#f0883e"/>
  <text x="939" y="33" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#f0883e">Warning</text>
  <circle cx="1002" cy="29" r="5" fill="#f85149"/>
  <text x="1013" y="33" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#f85149">Bad</text>

  <!-- ================= LEFT PANEL: WITHOUT SYMFORGE (RED / BAD) ================= -->
  <rect x="22" y="50" width="496" height="414" rx="12" fill="#191116" stroke="#6e2832" stroke-width="1.6"/>
  <rect x="38" y="64" width="230" height="24" rx="12" fill="#3d1a20" stroke="#f85149" stroke-width="1"/>
  <text x="153" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#f85149">✕ WITHOUT SYMFORGE (BAD)</text>
  <text x="502" y="80" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#f85149">5+ turns · tens of KB wasted</text>

  <!-- Bloated Whole File -->
  <rect x="40" y="102" width="192" height="274" rx="8" fill="#080d14" stroke="#6e2832" stroke-width="1.2"/>
  <text x="52" y="122" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#8b9bb4">src/daemon.rs (2,400 lines)</text>
  <line x1="40" y1="131" x2="232" y2="131" stroke="#6e2832" stroke-width="1"/>
  <rect x="52" y="143" width="130" height="6" rx="3" fill="#8b9bb4" opacity="0.28"/>
  <rect x="52" y="156" width="156" height="6" rx="3" fill="#f0883e" opacity="0.75"/>
  <text x="52" y="175" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#f0883e">! comment grep match (noise)</text>
  <rect x="52" y="184" width="144" height="6" rx="3" fill="#8b9bb4" opacity="0.28"/>
  <rect x="52" y="197" width="112" height="6" rx="3" fill="#8b9bb4" opacity="0.28"/>
  <rect x="52" y="210" width="164" height="6" rx="3" fill="#f0883e" opacity="0.75"/>
  <text x="52" y="229" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#f0883e">! string literal match (noise)</text>
  <rect x="52" y="239" width="150" height="18" rx="4" fill="#123220" stroke="#3fb950" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="60" y="252" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600" fill="#3fb950">fn target() [only 18 lines!]</text>
  <rect x="52" y="266" width="138" height="6" rx="3" fill="#8b9bb4" opacity="0.28"/>
  <rect x="52" y="279" width="162" height="6" rx="3" fill="#8b9bb4" opacity="0.28"/>
  <rect x="52" y="292" width="120" height="6" rx="3" fill="#8b9bb4" opacity="0.28"/>

  <rect x="50" y="314" width="172" height="48" rx="6" fill="#3d1a20" stroke="#f85149" stroke-width="1.3"/>
  <text x="60" y="333" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700" fill="#f85149">✕ .env.local read raw</text>
  <text x="60" y="350" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#e6edf3">Live secret enters LLM prompt</text>

  <!-- Ping-pong arrows -->
  <line x1="238" y1="158" x2="296" y2="158" stroke="#f85149" stroke-width="1.8" marker-end="url(#arrowBad)"/>
  <line x1="296" y1="178" x2="238" y2="178" stroke="#f85149" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowBad)"/>
  <line x1="238" y1="215" x2="296" y2="215" stroke="#f85149" stroke-width="1.8" marker-end="url(#arrowBad)"/>
  <line x1="296" y1="235" x2="238" y2="235" stroke="#f85149" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowBad)"/>
  <line x1="238" y1="272" x2="296" y2="272" stroke="#f85149" stroke-width="1.8" marker-end="url(#arrowBad)"/>
  <text x="267" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="700" fill="#f85149">5+ turns</text>

  <rect x="304" y="102" width="196" height="178" rx="8" fill="#111927" stroke="#6e2832" stroke-width="1.2"/>
  <text x="402" y="124" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#f85149">✕ Bloated Context Window</text>
  <rect x="318" y="136" width="168" height="22" rx="5" fill="#3d1a20"/>
  <text x="402" y="151" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700" fill="#f85149">94% irrelevant lines</text>
  <text x="318" y="177" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#f0883e">⚠ Grep hits comments &amp; strings</text>
  <text x="318" y="198" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#f0883e">⚠ No caller or type provenance</text>
  <text x="318" y="219" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#f85149">✕ Every step re-reads ~83k ctx</text>
  <text x="318" y="240" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#f85149">✕ No secret-value redaction</text>

  <rect x="304" y="294" width="196" height="82" rx="8" fill="#3d1a20" stroke="#f85149" stroke-width="1.3"/>
  <text x="402" y="317" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#f85149">✕ Blind String-Replace Edit</text>
  <text x="402" y="338" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#e6edf3">Whitespace drift or duplicate</text>
  <text x="402" y="355" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#e6edf3">text corrupts syntax on disk</text>

  <rect x="38" y="392" width="464" height="32" rx="6" fill="#3d1a20"/>
  <text x="270" y="413" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#f85149">✕ BAD: High token burn · multi-turn latency · unverified disk writes</text>

  <!-- ================= RIGHT PANEL: WITH SYMFORGE 12.0 (GREEN / GOOD) ================= -->
  <rect x="540" y="50" width="518" height="414" rx="12" fill="#0c1f17" stroke="#2ea043" stroke-width="1.8"/>
  <rect x="556" y="64" width="252" height="24" rx="12" fill="#123220" stroke="#3fb950" stroke-width="1"/>
  <text x="682" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#3fb950">✓ WITH SYMFORGE 12.0 (GOOD)</text>
  <text x="1040" y="80" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#3fb950">1 turn · ~600 B exact answer</text>

  <!-- LiveIndex -->
  <rect x="558" y="102" width="214" height="198" rx="8" fill="#111927" stroke="#263850" stroke-width="1.3"/>
  <text x="570" y="123" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#5ab4dd">LiveIndex (ArcSwap RAM)</text>
  <text x="570" y="140" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#8b9bb4">19 tree-sitter ASTs + Format-11 SHA256</text>
  <line x1="558" y1="148" x2="772" y2="148" stroke="#263850" stroke-width="1"/>

  <rect x="570" y="158" width="190" height="28" rx="5" fill="#123220" stroke="#3fb950" stroke-width="1.2"/>
  <text x="580" y="176" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700" fill="#3fb950">✓ fn target() [L241-259]</text>

  <rect x="584" y="194" width="176" height="24" rx="5" fill="#080d14" stroke="#263850" stroke-width="1"/>
  <text x="594" y="210" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#e6edf3">↳ 3 verified AST call sites</text>

  <rect x="584" y="224" width="176" height="24" rx="5" fill="#080d14" stroke="#263850" stroke-width="1"/>
  <text x="594" y="240" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#e6edf3">↳ docs isolated in knowledge</text>

  <rect x="570" y="256" width="190" height="34" rx="5" fill="#123220" stroke="#3fb950" stroke-width="1.1"/>
  <text x="580" y="271" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" fill="#3fb950">✓ admit_disk_read Shield</text>
  <text x="580" y="284" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" fill="#e6edf3">.env withheld (0 secret bytes)</text>

  <!-- 1-turn arrow -->
  <line x1="774" y1="184" x2="824" y2="184" stroke="#3fb950" stroke-width="2.2" marker-end="url(#arrowGood)"/>
  <text x="799" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="700" fill="#3fb950">1 turn</text>

  <!-- Monty VM -->
  <rect x="828" y="102" width="212" height="198" rx="8" fill="#111927" stroke="#3fb950" stroke-width="1.4"/>
  <text x="934" y="123" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#3fb950">✓ Monty VM (100% Rust)</text>
  <text x="934" y="140" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#8b9bb4">No Python runtime · Zero OS egress</text>
  <line x1="828" y1="148" x2="1040" y2="148" stroke="#263850" stroke-width="1"/>
  <text x="840" y="168" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#e6edf3">1. search_symbols()</text>
  <text x="840" y="186" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#e6edf3">2. find_references()</text>
  <text x="840" y="204" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#e6edf3">3. get_symbol(top_3)</text>
  <rect x="840" y="218" width="188" height="24" rx="5" fill="#123220"/>
  <text x="934" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" fill="#3fb950">✓ Schema: 3,980 B (-94.0%)</text>
  <rect x="840" y="250" width="188" height="38" rx="5" fill="#123220" stroke="#3fb950" stroke-width="1"/>
  <text x="934" y="266" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="700" fill="#3fb950">✓ STEL Trust Envelope</text>
  <text x="934" y="281" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" fill="#e6edf3">exact · complete · file:line</text>

  <!-- Verified Structural Edit -->
  <rect x="558" y="310" width="482" height="70" rx="8" fill="#111927" stroke="#3fb950" stroke-width="1.3"/>
  <rect x="572" y="324" width="100" height="42" rx="5" fill="#080d14" stroke="#263850"/>
  <text x="622" y="342" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600" fill="#e6edf3">.symforge/tee/</text>
  <text x="622" y="357" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#3fb950">✓ pre-write backup</text>
  <line x1="674" y1="345" x2="694" y2="345" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrowGood)"/>

  <rect x="698" y="324" width="104" height="42" rx="5" fill="#080d14" stroke="#263850"/>
  <text x="750" y="342" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600" fill="#e6edf3">tree-sitter</text>
  <text x="750" y="357" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#3fb950">✓ syntax verified</text>
  <line x1="804" y1="345" x2="824" y2="345" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrowGood)"/>

  <rect x="828" y="324" width="96" height="42" rx="5" fill="#080d14" stroke="#263850"/>
  <text x="876" y="342" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600" fill="#e6edf3">Atomic Write</text>
  <text x="876" y="357" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#3fb950">✓ or git worktree</text>
  <line x1="926" y1="345" x2="946" y2="345" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrowGood)"/>

  <rect x="950" y="324" width="78" height="42" rx="5" fill="#123220" stroke="#3fb950"/>
  <text x="989" y="342" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="700" fill="#3fb950">Disk Re-parse</text>
  <text x="989" y="357" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#e6edf3">ArcSwap live</text>

  <rect x="558" y="392" width="482" height="32" rx="6" fill="#123220"/>
  <text x="799" y="413" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#3fb950">✓ GOOD: -94% schema tax · lock-free RAM reads · verified disk writes</text>
</svg>
